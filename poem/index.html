<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王乐江诗歌全集</title>
<style>
:root{
  --paper: oklch(96.2% 0.016 82);
  --paper-deep: oklch(93.5% 0.022 80);
  --ink: oklch(27% 0.03 55);
  --ink-soft: oklch(43% 0.028 55);
  --ink-faint: oklch(58% 0.022 60);
  --cinnabar: oklch(50% 0.15 32);
  --cinnabar-soft: oklch(66% 0.1 35);
  --hair: oklch(84% 0.02 75);
  --hair-strong: oklch(72% 0.03 70);
  --serif: "Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans: "Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:17px;
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:color-mix(in oklch, var(--cinnabar) 22%, transparent);}

/* 背景竖排装饰 */
.bg-vertical{
  position:fixed;
  top:0;right:2vw;
  writing-mode:vertical-rl;
  font-size:clamp(3rem,9vw,7.5rem);
  font-weight:900;
  color:var(--paper-deep);
  letter-spacing:0.18em;
  z-index:0;
  pointer-events:none;
  user-select:none;
  line-height:1.15;
  text-shadow:0 0 1px color-mix(in oklch, var(--ink) 6%, transparent);
}
.page-wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 clamp(20px,5vw,56px);}

/* ===== Hero ===== */
.hero{
  padding:clamp(56px,9vw,108px) 0 clamp(32px,5vw,56px);
  display:grid;
  grid-template-columns:1fr auto;
  align-items:end;
  gap:24px;
  border-bottom:1px solid var(--hair-strong);
}
.hero-kicker{
  font-size:0.85rem;
  letter-spacing:0.42em;
  color:var(--ink-faint);
  margin-bottom:14px;
  font-weight:600;
}
.hero-title{
  font-size:clamp(2.5rem,7.2vw,4.6rem);
  font-weight:900;
  letter-spacing:0.1em;
  line-height:1.15;
  color:var(--ink);
}
.hero-sub{
  margin-top:18px;
  color:var(--ink-soft);
  font-size:clamp(0.92rem,2vw,1.02rem);
  line-height:1.9;
  max-width:56ch;
}
.hero-sub em{font-style:normal;color:var(--cinnabar);font-weight:600}
.hero-stats{
  margin-top:26px;
  display:flex;
  gap:clamp(22px,4vw,42px);
}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:clamp(1.6rem,3.4vw,2.2rem);font-weight:900;font-variant-numeric:tabular-nums}
.stat span{font-size:0.78rem;letter-spacing:0.22em;color:var(--ink-faint)}
.seal{
  width:clamp(64px,9vw,88px);
  height:clamp(64px,9vw,88px);
  border:3px solid var(--cinnabar);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--cinnabar);
  background:color-mix(in oklch, var(--cinnabar) 4%, transparent);
  box-shadow:0 6px 18px color-mix(in oklch, var(--cinnabar) 16%, transparent);
}
.seal-text{
  display:grid;
  grid-template-columns:repeat(2,auto);
  grid-template-rows:repeat(2,auto);
  align-items:center;
  justify-items:center;
  font-size:clamp(0.95rem,2vw,1.18rem);
  font-weight:900;
  line-height:1.25;
  letter-spacing:0.08em;
  text-align:center;
}
.back-btn{
  position:fixed;top:10px;left:10px;z-index:30;
  width:36px;height:36px;
  border-radius:50%;
  display:grid;place-items:center;
  background:color-mix(in oklch, var(--paper) 78%, transparent);
  border:1px solid var(--hair-strong);
  color:var(--ink-soft);
  font-size:0.95rem;
  line-height:1;
  padding:0;
  cursor:pointer;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 4px 14px color-mix(in oklch, var(--ink) 8%, transparent);
  transition:all .18s;
}
.back-btn:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.back-btn:active{transform:translateY(1px)}

/* ===== Toolbar ===== */
.toolbar{
  position:sticky;
  top:0;
  z-index:20;
  background:color-mix(in oklch, var(--paper) 92%, transparent);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  padding:18px 0 12px;
  border-bottom:1px solid var(--hair);
  margin-bottom:8px;
}
.search-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.search-box{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
}
.search-box .glyph{
  position:absolute;left:2px;color:var(--ink-faint);
  font-size:1.05rem;pointer-events:none;
}
.search-box input{
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1px solid var(--hair-strong);
  outline:none;
  padding:10px 2px 8px 30px;
  font-family:var(--serif);
  font-size:1rem;
  color:var(--ink);
  transition:border-color .25s;
  border-radius:0;
}
.search-box input::placeholder{color:var(--ink-faint);opacity:1}
.search-box input:focus{border-bottom-color:var(--cinnabar)}
.result-count{
  white-space:nowrap;
  font-size:0.85rem;
  color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.sort-btn{
  white-space:nowrap;
  background:transparent;
  border:1px solid var(--hair-strong);
  border-radius:999px;
  padding:7px 16px;
  font-family:var(--serif);
  font-size:0.85rem;
  color:var(--ink-soft);
  cursor:pointer;
  transition:all .2s;
  letter-spacing:0.08em;
}
.sort-btn:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.sort-btn.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filter-label{
  font-size:0.78rem;
  letter-spacing:0.24em;
  color:var(--ink-faint);
  margin:12px 0 8px;
  font-weight:600;
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--hair-strong);
  background:transparent;
  border-radius:999px;
  padding:6px 15px;
  font-family:var(--serif);
  font-size:0.86rem;
  color:var(--ink-soft);
  cursor:pointer;
  transition:all .18s;
  letter-spacing:0.06em;
  line-height:1.4;
}
.chip:hover{border-color:var(--cinnabar-soft);color:var(--cinnabar)}
.chip.active{
  background:var(--cinnabar);
  border-color:var(--cinnabar);
  color:color-mix(in oklch, var(--paper) 92%, white);
  font-weight:600;
}
.chip.sub{opacity:0.78}

/* ===== Poem list ===== */
.poem-list{padding:14px 0 80px}
.poem{
  padding:clamp(26px,4vw,40px) 0 clamp(22px,3.5vw,34px);
  border-bottom:1px solid var(--hair);
  position:relative;
  opacity:0;
  transform:translateY(10px);
  animation:riseIn .5s cubic-bezier(.22,.68,.32,1) forwards;
}
@keyframes riseIn{to{opacity:1;transform:translateY(0)}}
.poem::before{
  content:"";
  position:absolute;
  left:-8px;top:0;bottom:0;
  width:3px;
  background:var(--cinnabar);
  border-radius:2px;
  opacity:0;
  transform:scaleY(0.4);
  transition:all .28s cubic-bezier(.22,.68,.32,1);
}
.poem:hover::before{opacity:1;transform:scaleY(1)}
.poem{cursor:pointer}
.list-hint{
  margin:2px 0 6px;
  font-size:0.8rem;
  color:var(--cinnabar);
  letter-spacing:0.14em;
  display:flex;align-items:center;gap:6px;
  font-weight:600;
  background:color-mix(in oklch, var(--cinnabar) 7%, transparent);
  border:1px solid color-mix(in oklch, var(--cinnabar) 28%, transparent);
  border-radius:999px;
  padding:6px 14px;
  width:fit-content;
}
.list-hint::before{content:"☞";color:var(--cinnabar);font-size:0.9rem}
.poem-head{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:8px 14px;
  margin-bottom:6px;
}
.poem-no{
  font-size:0.8rem;
  color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
  letter-spacing:0.1em;
}
.poem-title{
  font-size:clamp(1.3rem,3vw,1.55rem);
  font-weight:900;
  letter-spacing:0.08em;
}
.poem-genre{
  font-size:0.78rem;
  border:1px solid var(--hair-strong);
  color:var(--ink-soft);
  padding:1px 10px;
  border-radius:999px;
  letter-spacing:0.16em;
  font-weight:600;
}
.poem-genre.lv{color:var(--cinnabar);border-color:color-mix(in oklch, var(--cinnabar) 40%, var(--hair-strong))}
.poem-date{
  margin-left:auto;
  font-size:0.85rem;
  color:var(--cinnabar);
  font-weight:600;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.poem-epigraph{
  margin:6px 0 14px;
  font-size:0.9rem;
  color:var(--ink-faint);
  font-style:italic;
  padding-left:1.2em;
  border-left:2px solid var(--hair-strong);
  white-space:pre-line;
}
/* 作者切换栏 */
.author-nav{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:22px;
}
.author-link{
  border:1.5px solid var(--cinnabar-soft);
  background:color-mix(in oklch, var(--cinnabar) 6%, transparent);
  border-radius:999px;
  padding:8px 18px;
  font-family:var(--serif);
  font-size:0.9rem;
  color:var(--cinnabar);
  cursor:pointer;
  text-decoration:none;
  letter-spacing:0.08em;
  font-weight:600;
  transition:all .2s;
}
.author-link:hover{
  border-color:var(--cinnabar);
  background:var(--cinnabar);
  color:color-mix(in oklch, var(--paper) 92%, white);
}
.author-link.active{
  background:var(--cinnabar);
  border-color:var(--cinnabar);
  color:color-mix(in oklch, var(--paper) 92%, white);
  font-weight:600;
}
.poem-body{
  padding:8px 0 4px;
  max-width:52ch;
}
.poem-body p{
  font-size:clamp(1.02rem,2.2vw,1.15rem);
  letter-spacing:0.05em;
  line-height:2;
  margin-bottom:2px;
}
.poem-note{
  margin-top:14px;
  font-size:0.84rem;
  color:var(--ink-faint);
  line-height:1.8;
}
.poem-note .note-mark{
  color:var(--cinnabar-soft);
  margin-right:6px;
  letter-spacing:0.2em;
  font-size:0.78rem;
}

/* ===== Poem detail view ===== */
.detail-view{display:none;padding:8px 0 80px}
body.detail-open .hero,body.detail-open .toolbar,body.detail-open .poem-list{display:none}
body.detail-open .detail-view{display:block}
.detail-head{
  display:flex;align-items:baseline;flex-wrap:wrap;
  gap:8px 14px;margin-bottom:6px;
}
.detail-title{
  font-size:clamp(1.5rem,4vw,2rem);
  font-weight:900;
  letter-spacing:0.08em;
}
.detail-back{
  display:inline-flex;align-items:center;gap:6px;
  margin-bottom:18px;
  background:transparent;
  border:1px solid var(--hair-strong);
  border-radius:999px;
  padding:6px 16px;
  font-family:var(--serif);
  font-size:0.85rem;
  color:var(--ink-soft);
  cursor:pointer;
  letter-spacing:0.08em;
  transition:all .2s;
}
.detail-back:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.detail-body{padding:12px 0 4px;max-width:52ch}
.detail-body p{
  font-size:clamp(1.08rem,2.4vw,1.22rem);
  letter-spacing:0.05em;
  line-height:2.05;
  margin-bottom:2px;
}
.detail-actions{
  display:flex;gap:10px;flex-wrap:wrap;
  margin-top:26px;
  padding-top:18px;
  border-top:1px solid var(--hair);
}
.action-btn{
  border:1.5px solid var(--hair-strong);
  background:transparent;
  border-radius:999px;
  padding:9px 22px;
  font-family:var(--serif);
  font-size:0.92rem;
  color:var(--ink-soft);
  cursor:pointer;
  letter-spacing:0.12em;
  font-weight:600;
  transition:all .2s;
}
.action-btn:hover{border-color:var(--cinnabar);color:var(--cinnabar);transform:translateY(-1px)}
.action-btn.active{
  background:var(--cinnabar);
  border-color:var(--cinnabar);
  color:color-mix(in oklch, var(--paper) 92%, white);
}
.detail-output{margin-top:8px}
.ai-box{
  margin-top:20px;
  border:1px solid var(--hair-strong);
  border-radius:14px;
  padding:18px 20px 16px;
  background:color-mix(in oklch, var(--paper-deep) 45%, transparent);
  position:relative;
  animation:riseIn .45s cubic-bezier(.22,.68,.32,1) forwards;
}
.ai-box::before{
  content:"";
  position:absolute;
  left:-8px;top:14px;bottom:14px;
  width:3px;
  background:var(--cinnabar-soft);
  border-radius:2px;
}
.ai-box-title{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.ai-box-title b{
  font-size:0.86rem;
  letter-spacing:0.24em;
  color:var(--cinnabar);
  font-weight:700;
}
.ai-box-tag{
  font-size:0.68rem;
  color:var(--ink-faint);
  letter-spacing:0.1em;
  border:1px solid var(--hair-strong);
  border-radius:999px;
  padding:1px 9px;
}
.ai-box-content{
  font-size:0.95rem;
  line-height:1.95;
  color:var(--ink-soft);
  white-space:pre-wrap;
  word-break:break-word;
}
.ai-box-content strong{color:var(--ink)}
.ai-box-content code{
  background:color-mix(in oklch, var(--paper-deep) 70%, transparent);
  border-radius:4px;
  padding:0 5px;
  font-size:0.86em;
}
.ai-loading{
  display:flex;align-items:center;gap:10px;
  color:var(--ink-faint);
  font-size:0.9rem;
  letter-spacing:0.1em;
}
.ai-loading .typing-indicator{display:inline-flex;gap:4px}
.ai-loading .typing-indicator span{
  width:6px;height:6px;border-radius:50%;
  background:var(--cinnabar-soft);
  animation:typingBounce 1.2s infinite ease-in-out;
}
.ai-loading .typing-indicator span:nth-child(2){animation-delay:.15s}
.ai-loading .typing-indicator span:nth-child(3){animation-delay:.3s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.ai-error{color:var(--cinnabar);font-size:0.9rem;letter-spacing:0.05em}
.jianzhu-area{
  width:100%;
  min-height:140px;
  border:1px solid var(--hair-strong);
  border-radius:10px;
  background:color-mix(in oklch, var(--paper) 80%, transparent);
  padding:12px 14px;
  font-family:var(--serif);
  font-size:0.94rem;
  line-height:1.9;
  color:var(--ink);
  resize:vertical;
  outline:none;
  transition:border-color .25s;
}
.jianzhu-area:focus{border-color:var(--cinnabar-soft)}
.jianzhu-save{
  margin-top:10px;
  border:1.5px solid var(--cinnabar-soft);
  background:transparent;
  border-radius:999px;
  padding:6px 20px;
  font-family:var(--serif);
  font-size:0.85rem;
  color:var(--cinnabar);
  cursor:pointer;
  letter-spacing:0.1em;
  transition:all .2s;
}
.jianzhu-save:hover{background:var(--cinnabar);color:color-mix(in oklch, var(--paper) 92%, white)}
.jianzhu-hint{margin-top:8px;font-size:0.74rem;color:var(--ink-faint);letter-spacing:0.05em}

/* ===== Empty ===== */
.empty{
  text-align:center;
  padding:90px 20px 110px;
  color:var(--ink-faint);
}
.empty .seal-big{
  width:74px;height:74px;
  margin:0 auto 22px;
  border:2px solid var(--hair-strong);
  border-radius:50%;
  display:grid;place-items:center;
  font-size:1.7rem;
  color:var(--hair-strong);
}
.empty h3{font-size:1.2rem;font-weight:700;color:var(--ink-soft);letter-spacing:0.1em;margin-bottom:8px}
.empty p{font-size:0.92rem}

/* ===== Footer ===== */
footer{
  border-top:1px solid var(--hair-strong);
  padding:26px 0 46px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  color:var(--ink-faint);
  font-size:0.8rem;
  letter-spacing:0.14em;
}

/* ===== Responsive ===== */
@media (max-width:640px){
  /* 顶部压缩：横向排版，减小字号与留白 */
  .hero{
    padding:24px 0 18px;
    grid-template-columns:1fr auto;
    gap:14px;
  }
  .hero-kicker{font-size:0.7rem;letter-spacing:0.3em;margin-bottom:6px}
  .hero-title{font-size:clamp(1.6rem,6vw,2.2rem);letter-spacing:0.06em}
  .hero-sub{margin-top:8px;font-size:0.82rem;line-height:1.6;max-width:none}
  .hero-stats{margin-top:12px;gap:14px}
  .stat b{font-size:1.2rem}
  .stat span{font-size:0.66rem;letter-spacing:0.14em}
  .seal{width:56px;height:56px;border-width:2px}
  .seal-text{font-size:0.78rem;letter-spacing:0.04em}
  .author-nav{margin-top:12px;gap:6px}
  .author-link{padding:5px 12px;font-size:0.78rem}
  /* 工具栏压缩 */
  .toolbar{padding:10px 0 8px;margin-bottom:4px}
  .search-row{gap:8px;margin-bottom:8px;flex-wrap:nowrap}
  .search-box input{padding:7px 2px 6px 26px;font-size:0.88rem}
  .result-count{font-size:0.74rem}
  .sort-btn{padding:5px 10px;font-size:0.76rem;letter-spacing:0.04em}
  .filter-label{margin:6px 0 5px;font-size:0.66rem;letter-spacing:0.18em}
  .chips{gap:5px}
  .chip{padding:4px 10px;font-size:0.76rem;letter-spacing:0.02em;line-height:1.3}
  /* 诗列表压缩 */
  .poem-list{padding:6px 0 60px}
  .poem{padding:14px 0 12px}
  .poem-head{gap:5px 10px;margin-bottom:4px}
  .poem-no{font-size:0.72rem}
  .poem-title{font-size:clamp(1.1rem,4vw,1.3rem);letter-spacing:0.04em}
  .poem-genre{font-size:0.68rem;padding:1px 7px;letter-spacing:0.1em}
  /* 日期横向内联，不再独占一行 */
  .poem-date{margin-left:auto;font-size:0.74rem;width:auto}
  .poem-epigraph{margin:4px 0 8px;font-size:0.78rem;padding-left:0.9em}
  .poem-body{padding:4px 0 2px}
  .poem-body p{font-size:clamp(0.95rem,3vw,1.05rem);line-height:1.75;letter-spacing:0.02em;margin-bottom:1px}
  .poem-note{margin-top:8px;font-size:0.76rem;line-height:1.65}
  /* 详情视图 */
  .detail-view{padding:4px 0 60px}
  .detail-back{margin-bottom:12px;padding:5px 14px;font-size:0.8rem}
  .detail-title{font-size:clamp(1.3rem,5vw,1.7rem)}
  .detail-body p{font-size:clamp(1rem,3.4vw,1.1rem);line-height:1.9}
  .detail-actions{gap:8px;margin-top:18px;padding-top:14px}
  .action-btn{padding:7px 16px;font-size:0.84rem;letter-spacing:0.06em}
  .ai-box{padding:14px 14px 12px;margin-top:14px}
  .ai-box-content{font-size:0.88rem;line-height:1.85}
  .jianzhu-area{min-height:110px;font-size:0.88rem}
}
@media (max-width:380px){
  .hero-stats{flex-wrap:wrap;gap:10px 16px}
  .search-row{flex-wrap:wrap}
  .result-count{margin-left:auto}
}

/* ===== Reduced motion ===== */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .poem{opacity:1;transform:none;animation:none}
  *{transition:none!important}
}
</style>
</head>
<body>

<div class="bg-vertical" id="bgVertical">诗稿</div>

<div class="page-wrap">

  <button class="back-btn" type="button" aria-label="返回" id="backBtn">←</button>

  <header class="hero">
    <div>
      <h1 class="hero-title" id="heroTitle">王乐江诗歌全集</h1>
      <p class="hero-sub" id="heroSub"></p>
      <div class="hero-stats">

    seal: '退安<br>诗词',

    poems: [
      {"title":"古箫吟风曲有感","genre":"五绝","create":"2026-08-26","createLabel":"2026年08月26日","lines":["沉箫掠水间，","似起玉壶圆。","苍岭云痕淡，","粼光倒碧天。"],"note":"沉箫：音色低沉、悠长厚重的箫声；掠水：箫声轻轻拂过水面，贴着水波回荡；玉壶：此处代指水面一圈圈圆润透亮的涟漪。","epigraph":"宣德六年七月十三日十四时十一分作"},
      {"title":"无题","genre":"古诗","create":"2026-06-11","createLabel":"2026年06月11日","lines":["春来雁知归，永逝莫能回。","去者犹余念，山风入梦随。","但悲泉路远，冷月照寒闺。","千树花零落，空教稚子追。"],"note":"","epigraph":""},
      {"title":"无题","genre":"七绝","create":"2026-05-06","createLabel":"2026年05月06日","lines":["唯见晴光铺野开，爱随新燕过桥来。","子规声懒斜阳暖，文杏浮香入露台。"],"note":"宣德六年三月二十日作","epigraph":"赠子文，宣德六年三月二十日作"},
      {"title":"清明归乡","genre":"七律","create":"2026-04-07","createLabel":"2026年04月07日","lines":["门前桃树花如旧，陌上荒蹊草自青。","屋畔新居春寂寂，杏阴老院月冥冥。","风来似送书声近，蜂落唯怜香蕊轻。","常记儿时深夜雨，一宵清冷到天明。"],"note":"","epigraph":"宣德六年二月二十日作"},
      {"title":"悯农","genre":"五律","create":"2026-03-13","createLabel":"2026年03月13日","lines":["夏暑正田忙，躬身锄草荒。","茫茫灼旱土，漠漠萎禾秧。","万井祈稀雨，千畴换斗粮。","风愁炎日尽，人却道天凉。"],"note":"","epigraph":""},
      {"title":"无题","genre":"古诗","create":"2026-03-06","createLabel":"2026年03月06日","lines":["资平万事苦，人易我独艰。","奋飞何所望，自证明才堪。","家贫今当立，此任子当担。","岂效纨绔儿，纵己落平川。","忍为庸碌郎，我自向天攀。","万难我必历，勿教后人难。","寸心难表意，不负少年冠。","秋霜放肆笑，逢春花自开。"],"note":"","epigraph":"古诗，2026年3.6日考研复习作"},
      {"title":"夜渡","genre":"五绝","create":"2026-03-04","createLabel":"初稿2022年10月16日 · 定稿2026年03月04日","lines":["尘月青烟渡，风笛透客愁。","寻迁万州路，孤愿寄归舟。"],"note":"2022年10月16日高考复读之年作","epigraph":""},
      {"title":"放言","genre":"七绝","create":"2026-02-12","createLabel":"2026年02月12日","lines":["文腐才虚假上宾，沽名重利自难清。","南枝老树寥无物，虫笑聚言花在听。"],"note":"宣德五年十二月廿五日作，新韵诗","epigraph":""},
      {"title":"秋","genre":"七律","create":"2025-09-25","createLabel":"2025年09月25日","lines":["秋烦小巷叶愁黄，风恶乱旋残日凉。","昔鹊忙庭得见处，今丝闲院月离窗。","伤花避泪垂翘首，悲草藏孤压厚霜。","微雨暗城秋渐去，落白又蔽旧垣墙。"],"note":"宣德五年八月初四作","epigraph":""},
      {"title":"沈园感«钗头凤»","genre":"七律","create":"2025-09-12","createLabel":"初稿2023年10月26日 · 定稿2025年09月12日","lines":["秋苑梧桐辞旧叶，西风催雁觅新安。","沈园负誓墙垣破，云梦寻盟鸾凤欢。","散若三秋缘道尽，偏逢六载意犹寒。","垂丝岸柳春还绿，旧处河池空怨残。"],"note":"","epigraph":""},
      {"title":"故夏","genre":"七绝","create":"2025-09-12","createLabel":"初稿2025年03月21日 · 定稿2025年09月12日","lines":["少儿持棍互逐藏，衣溅河泥嬉闹脏。","总角故人今又在，惟余蝉寂旧篱墙。"],"note":"","epigraph":""},
      {"title":"乙巳年立夏前游成都杂诗","genre":"古诗","create":"2025-05-01","createLabel":"2025年05月01日","lines":["轻衣初炎立夏头，辞陇入蜀越山丘。","密竹缠雨润青叶，灯夜江堰碎河风。","茅亭阶前新草旺，古柏武侯旧红墙。","锦里长街残路尽，短巷烟火香满楼。","残年若入西川路，恐少当年旧风流。","今朝春雨问海棠，昔年故院梨花香。"],"note":"宣德五年四月初四日作","epigraph":"同汉生、赵濡攸游作"},
      {"title":"无恨","genre":"古诗","create":"2024-11-19","createLabel":"2024年11月19日","lines":["常秋悽悽非今秋，今秋恰暖月不愁。","来时二载四季度，晴雨霜雪似梦中。","离恨终悔当时错，不若惜此未离别。","春满乱花未隐漫，勿教花落尽恨花。"],"note":"宣德四年十月十九日作","epigraph":"杂诗（其二）"},
      {"title":"甲辰中秋游广元杂记","genre":"古诗","create":"2024-09-17","createLabel":"2024年09月17日","lines":["长月中秋嘉陵舟，巴山烟雨凤凰楼。","天堑剑阁阴平渡，三万兵马自破蜀。","舍身崖间梁山寺，千年唯余紫薇风。","若非相辞短日后，不负西南晚来秋。"],"note":"同汉生、赵濡攸游作","epigraph":""},
      {"title":"无题","genre":"七绝","create":"2024-05-20","createLabel":"初稿2022年11月30日 · 定稿2024年05月20日","lines":["西风日暮赏秋意，执手轻言誓和鸣。","不寄忘川生世梦，惟怜湖榭月遥明。"],"note":"","epigraph":""},
      {"title":"仲夏","genre":"古诗","create":"2024-05-15","createLabel":"2024年05月15日","lines":["树影斑驳瘦南风，年华恰此散愁浓。","他时若念旧今梦，又逢一年是夏中。"],"note":"宣德四年四月初八","epigraph":""},
      {"title":"清明游忆曾年夏日（离思其七）","genre":"古诗","create":"2024-04-05","createLabel":"2024年04月05日","lines":["翠微映山桃花红，清雨蒙蒙梨花香。","家山寥景非此佳，此又独欠玉兰花。","故曲廉轻何所困？若逢旧景万情深。","曾年初夏衔落日，今余静淡沐春风。"],"note":"玉兰花：花语","epigraph":"同汉生、赵濡攸游作"},
      {"title":"离思（其六）","genre":"古诗","create":"2024-03-29","createLabel":"2024年03月29日","lines":["东风柔雨柳青青，暖春临江雁长鸣。","桃李花开年年谢，过往逢景处处生。","遗恨携季匆匆过，世人贪执多流连。","浮生多是短途客，切莫回头空念旧。"],"note":"","epigraph":"宣德四年二月廿十日作"},
      {"title":"夜来幽梦","genre":"古诗","create":"2024-02-26","createLabel":"2024年02月26日","lines":["情本君卿，伤苦唯己，痛心疾首道恨缘，","故地重游不复见，悄然识旧物，唯有空悲悯。","何求复见，怕难如故，海誓山盟今同在，","飘雪执手非故人，寒夜望新月，只道早忘矣。"],"note":"","epigraph":"宣德四年正月十七戌时作"},
      {"title":"新岁有感","genre":"古诗","create":"2024-02-10","createLabel":"2024年02月10日","lines":["甲辰临近往事清，旧缘自断新岁乐。","行止休困皆因己，脱于此间唯道心。"],"note":"宣德四年元月一日作","epigraph":""},
      {"title":"种和落日有感","genre":"古诗","create":"2024-01-27","createLabel":"2024年01月27日","lines":["种和残阳落乾门，萧萧枝木送北风。","济济客舍无为乐，小径幽清熬人心。","晓夕星夜逢人度，日月尚分新旧年。","昔年落暮同今似，今岁入新无故人。"],"note":"种和地名，宣德三年十二月十七日作","epigraph":""},
      {"title":"离思","genre":"古诗","create":"2024-01-02","createLabel":"初稿2023年12月31日 · 定稿2024年01月02日","lines":["自孽三载未有昭，但却善恶必时报。","卦起不曾自明算，卦解唯有心惶惶。","南花未散不曾惜，年尽残余终自悯。","但愿五湖明月在，终须还了鸳鸯债。"],"note":"","epigraph":""},
      {"title":"无望","genre":"古诗","create":"2023-08-07","createLabel":"2023年08月07日","lines":["故曲复闻多几载，满伤再忆若如初。","俗人无难关绚素，唯留余恨空自度。","残叶秋湖倒璧月，只此相思遥寄君。","无穷悲凉尽数受，隐隐浮沉落心中。"],"note":"宣德三年六月廿一日作","epigraph":""},
      {"title":"月菊有感","genre":"古诗","create":"2023-03-29","createLabel":"2023年03月29日","lines":["功名奉承世俗物，何处再寻旧少年。","自若金印难授佩，不如菊酒月落前。"],"note":"宣德三年闰二月初八日作","epigraph":"来时傥佩黄金印，莫见苏秦不下机"},
      {"title":"喜春","genre":"古诗","create":"2023-03-14","createLabel":"2023年03月14日","lines":["东风迟语早春晚，未防山桃迎时开。","最怜微暮落山处，喜作闲诗度春安。"],"note":"宣德三年二月廿三日作","epigraph":""},
      {"title":"望月怀远","genre":"古诗","create":"2022-09-10","createLabel":"2022年09月10日","lines":["清月残杯琼瑶露，且醉怀思尽涕流。","寂秋舟行惟勤聚，共语为幸抵万留。","自作孤离远途客，似倾满月比寒惆。","何得半时清闲梦，会与极乐解罹忧。"],"note":"宣德二年八月十五日作","epigraph":""},
      {"title":"自题","genre":"古诗","create":"2022-09-08","createLabel":"2022年09月08日","lines":["浮沉半卋难寻乐，缘信万物难信佛。","奈何黄天空赋意，只叫相思寸苦辛。","凄夜孤酌乱愁绪，倚首月色彼满倾。","弥恨难解自泪涕，恐是明月知我心。"],"note":"","epigraph":""},
      {"title":"西桥阑墨","genre":"古诗","create":"2022-08-31","createLabel":"2022年08月31日","lines":["墨迹山川轻云净，诗雨江南赤子心。","倚舟闲月乘情渡，凭栏望远俟君音。"],"note":"俟：等待；共创，和汉生","epigraph":""},
      {"title":"离思（其四）","genre":"古诗","create":"2022-08-13","createLabel":"2022年08月13日","lines":["风露旭日烟云尽，微风拂柳映湖清。","轻墨难语书生意，舟倚西桥醉琴音。","若许良月星辰夜，定胜梧桐落叶时。","尘风落雪三千去，只忆相思呈作君。"],"note":"离思其四","epigraph":""},
      {"title":"离思（其二）","genre":"古诗","create":"2022-05-29","createLabel":"2022年05月29日","lines":["斜暮垂日紫雲生，半城仲夏半城人。","青林山涧岩枫嶂，江畔新柳影自摇。","常悲逢世不得志，遗恨万古自不成。","曾是清风孤对月，淡酌白露忆旧人。"],"note":"离思（其二）","epigraph":""},
      {"title":"离思","genre":"古诗","create":"2022-06-01","createLabel":"2022年06月01日","lines":["枯荆黄沙满孤城，烟月凝霜寒气生。","风嘶长鸣惊天破，雨骤残阳似忘川。","百战城破壮士尽，弥留归途倚马行。","纵隔万里意常近，戎装赴远自寻君。"],"note":"","epigraph":""},
      {"title":"瑞雪有怀","genre":"古诗","create":"2021-12-15","createLabel":"2021年12月","lines":["冬月寒气近，秋叶入尘中。","三年隙驹事，犹是昨日休。","微颔忆昔日，孤身梦云春。","落雪江北地，枯木道清幽。"],"note":"","epigraph":""},
      {"title":"离思","genre":"古诗","create":"2022-04-18","createLabel":"2022年04月18日","lines":["空山枯木得复青，欣红染莺犹有情。","伴行蝉鸣清泉路，舟途碧池倒新影。","梦悽宿起何穷尽，书诉风雨夜凄凄。","日暮听取青鸾信，若寄相思归鸿音。"],"note":"","epigraph":""},
      {"title":"凝诀意","genre":"古诗","create":"2022-04-20","createLabel":"2022年04月20日","lines":["凛凛厉风湿长亭，日隐愁云役物凄。","廊檐雨霁空阶明，纤云烟海障却影。","不携尘染尽绝信，除余误兮皆作明？","若知当年君真意，岂敢一语道西京。"],"note":"西京：长安","epigraph":""},
      {"title":"梦忆秋日幕霞","genre":"古诗","create":"2022-01-26","createLabel":"2022年01月26日","lines":["舟起广平岸，临至缥缈山。","金波潾湖曳，暮近点树昏。","鬓丝任风移，睥雁两相怿。","伴云映落日，执手长恃依。"],"note":"怿：欢喜","epigraph":""}
    ]
  },

      {"title":"行香子·念昔","genre":"词","create":"2022-03-01","createLabel":"2022年03月","lines":["轻拊柴扉，绪若溪澄。","忆昔年、意气清泠。","寸心未动，蓦惊风铃。","原是风起，穿林去，方始觉。","望云舒卷，闲卧溪亭。","栖禽处、半盏余茗。","醉携佳人，共辩虚盈。","黛山雾萦，星落庭，月疏影。"],"note":"","epigraph":"序：余早年学诸外乡，虽心性尚佳，略有天资。奈何人生长恨，际遇不佳。几度沉浮，顿觉苍凉。故成此文。"},
      {"title":"采桑子·终离","genre":"词","create":"2022-03-02","createLabel":"2022年03月","lines":["初逢笑靥春风里，少年意气，沧海难为。","胫畔银铃伊系，风也温柔，雨也温柔。","往日欢笑今成空。","人世歧路，此恨谁同？","烛残未觉人已去，但听风吟，且闻雨落。"],"note":"","epigraph":"自评曰：碧玉破瓜后，年将弱冠时\n           斯人辞我去，才知终离意。"},
      {"title":"霜天晓角·过剑阁","genre":"词","create":"2024-09-17","createLabel":"2024年09月17日","lines":["雾起山檐。须臾古今事。","了了三秦巴蜀，苍烟落、照关山。","莫悲。前尘故。月晦星尚明。","惟有今人思古，昔年郎，归何处？"],"note":"","epigraph":"同汉生、退安游作"},
      {"title":"霜天晓角·半生","genre":"词","create":"2024-06-01","createLabel":"2024年06月","lines":["风喧日丽，未敢殁光阴。","怎奈去日多苦，风凋叶，雾满阁。","也罢，莫回首。","他乡亦归途。","不过风霜几许，梦暂别，山月斜。"],"note":"","epigraph":""},
      {"title":"清平乐·不归处","genre":"词","create":"2022-08-28","createLabel":"2022年08月28日晚","lines":["绰约姿妍，浓淡随君意。","笙箫起落影沉璧，唇畔红妆似血。","沉暮重云未雨，西风抚帐惊烛。","倚徙怜卿朝暮，陌上霜雪凌尘。"],"note":"","epigraph":""}

  hs: {

    title: '汉生诗词集',

    seal: '汉生<br>诗词',
    sealTitle: '汉生诗词',
    poems: [
      {"title":"西桥阑墨","genre":"古诗","create":"2022-08-31","createLabel":"2022年08月31日","lines":["墨迹山川轻云净，诗雨江南赤子心。","倚舟闲月乘情渡，凭栏望远俟君音。"],"note":"俟：等待；共创，和王乐江","epigraph":""},
      {"title":"一剪梅·隐","genre":"词","create":"2022-08-31","createLabel":"2022年08月31日","lines":["轻拊柴扉绪如风，溪畔伏羽，茗留余香。","闲看天色云舒卷，他年意气，浩渺若尘。","穿木欲出撩风铃，原是心静，未觉风起。","醉携佳人辩分野，云雾黛山，皓月星尘。"],"note":"","epigraph":""}
    ]
  }
};

const ORDER = ['wlj','ruz','hs'];

// ===== DOM 引用 =====
const listEl = document.getElementById('poemList');
const searchEl = document.getElementById('searchInput');
const sortBtn = document.getElementById('sortBtn');
const resultCount = document.getElementById('resultCount');
const statTotal = document.getElementById('stat-total');
const statGu = document.getElementById('stat-gu');
const statLv = document.getElementById('stat-lv');
const statCi = document.getElementById('stat-ci');
const heroTitle = document.getElementById('heroTitle');
const heroSub = document.getElementById('heroSub');
const heroSeal = document.getElementById('heroSeal');
const bgVertical = document.getElementById('bgVertical');
const authorNav = document.getElementById('authorNav');
const backBtn = document.getElementById('backBtn');
const footLeft = document.getElementById('footLeft');

let state = { q:'', genre:'all', year:'all', asc:false };
let POEMS = [];

function getCurrentAuthor(){
  const m = location.hash.match(/a=([a-z]+)/);
  const id = m ? m[1] : 'wlj';
  return AUTHORS[id] || AUTHORS.wlj;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function genreClass(g){ return ['七绝','五绝','七律','五律'].includes(g) ? 'lv' : ''; }

// 按 create 时间正序排（最老→最新），相同时间则保留原数据顺序
function sortByTimeAsc(poems){
  return poems.map((p,i)=>Object.assign({}, p, {_i:i}))
    .sort((a,b)=> a.create.localeCompare(b.create) || (a._i - b._i));
}

function applyAuthor(){
  const a = getCurrentAuthor();
  document.title = a.title;
  heroTitle.textContent = a.title;
  heroSub.textContent = a.sub;
  heroSeal.title = a.sealTitle;
  heroSeal.querySelector('.seal-text').innerHTML = a.seal;
  bgVertical.textContent = a.name + '诗稿';
  footLeft.innerHTML = a.title + ' · 共 <b id="footTotal">0</b> 首';

  // 作者切换按钮：显示另外两位
  authorNav.innerHTML = ORDER.filter(id=>id!==a.id).map(id=>{
    const o = AUTHORS[id];
    return '<a class="author-link" href="#a='+id+'" data-id="'+id+'">'+o.name+'诗词</a>';
  }).join('');

  // 重置筛选与搜索（默认逆序：最近在前）
  state = { q:'', genre:'all', year:'all', asc:false };
  searchEl.value = '';
  sortBtn.textContent = '时间 ↓';
  document.querySelectorAll('#genreChips .chip').forEach(c=>c.classList.toggle('active', c.dataset.genre==='all'));
  document.querySelectorAll('#yearChips .chip').forEach(c=>c.classList.toggle('active', c.dataset.year==='all'));

  // 按时间正序赋编号：最老的为1，最新的为最大
  const sorted = sortByTimeAsc(a.poems);
  POEMS = sorted.map((p,i)=>{ const {_i, ...rest} = p; return Object.assign({no:i+1}, rest); });

  // 统计
  const footTotal = document.getElementById('footTotal');
  statTotal.textContent = POEMS.length;
  footTotal.textContent = POEMS.length;
  statGu.textContent = POEMS.filter(p=>p.genre==='古诗').length;
  statLv.textContent = POEMS.filter(p=>['七绝','五绝','七律','五律'].includes(p.genre)).length;
  statCi.textContent = POEMS.filter(p=>p.genre==='词').length;

  render();

  // 详情路由：hash 带 &p=编号 时进入详情视图
  const pm = location.hash.match(/p=(\d+)/);
  if(pm) showDetail(parseInt(pm[1],10));
  else hideDetail();
}

function render(){
  let q = state.q.trim().toLowerCase();
  let filtered = POEMS.filter(p=>{
    if(state.genre!=='all' && p.genre!==state.genre) return false;
    if(state.year!=='all' && !String(p.create).startsWith(state.year)) return false;
    if(q){
      const hay = [p.title, p.epigraph, p.note, ...p.lines].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  // 1. 先按时间正序赋 displayNo（最老的为1，最新的为最大）
  //    ——这样筛选模式下也能连续编号，不再跳号
  filtered = filtered.slice().sort((a,b)=> a.create.localeCompare(b.create) || a.no - b.no)
    .map((p,i)=>Object.assign({}, p, {displayNo:i+1}));

  // 2. 再按用户期望的展示顺序排（默认逆序：最近在前）
  filtered.sort((a,b)=>{
    const d = state.asc ? a.create.localeCompare(b.create) : b.create.localeCompare(a.create);
    if(d!==0) return d;
    return a.no - b.no;
  });

  resultCount.textContent = filtered.length + ' 首';

  if(!filtered.length){
    listEl.innerHTML = '<div class="empty"><div class="seal-big">空</div><h3>没有找到符合条件的诗</h3><p>试试更换关键词，或调整体式 / 年份筛选。</p></div>';
    return;
  }

  listEl.innerHTML = '<p class="list-hint">轻触诗篇，可查看翻译 · AI评诗 · 笺注</p>' + filtered.map((p,i)=>{
    const linesHtml = p.lines.map(l=>'<p>'+esc(l)+'</p>').join('');
    const epi = p.epigraph ? '<div class="poem-epigraph">'+esc(p.epigraph)+'</div>' : '';
    const note = p.note ? '<div class="poem-note"><span class="note-mark">注</span>'+esc(p.note)+'</div>' : '';
    return '<article class="poem" data-no="'+p.no+'" style="animation-delay:'+Math.min(i*45,360)+'ms">'
      + '<div class="poem-head">'
      + '<span class="poem-no">' + String(p.displayNo).padStart(2,'0') + '</span>'
      + '<h2 class="poem-title">' + esc(p.title) + '</h2>'
      + '<span class="poem-genre '+genreClass(p.genre)+'">' + esc(p.genre) + '</span>'
      + '<span class="poem-date">' + esc(p.createLabel) + '</span>'
      + '</div>'
      + epi
      + '<div class="poem-body">' + linesHtml + '</div>'
      + note
      + '</article>';
  }).join('');
}

// 事件
searchEl.addEventListener('input', e=>{ state.q = e.target.value; render(); });

document.getElementById('genreChips').addEventListener('click', e=>{
  const btn = e.target.closest('.chip'); if(!btn) return;
  state.genre = btn.dataset.genre;
  document.querySelectorAll('#genreChips .chip').forEach(c=>c.classList.toggle('active', c===btn));
  render();
});

document.getElementById('yearChips').addEventListener('click', e=>{
  const btn = e.target.closest('.chip'); if(!btn) return;
  state.year = btn.dataset.year;
  document.querySelectorAll('#yearChips .chip').forEach(c=>c.classList.toggle('active', c===btn));
  render();
});

sortBtn.addEventListener('click', ()=>{
  state.asc = !state.asc;
  sortBtn.textContent = state.asc ? '时间 ↑' : '时间 ↓';
  render();
});

// 作者切换：pushState 让 history.back() 能逐层返回
authorNav.addEventListener('click', e=>{
  const link = e.target.closest('.author-link'); if(!link) return;
  e.preventDefault();
  const id = link.dataset.id;
  if(!AUTHORS[id]) return;
  history.pushState({a:id}, '', '#a='+id);
  applyAuthor();
  window.scrollTo({top:0, behavior:'smooth'});
});

window.addEventListener('popstate', applyAuthor);

// 返回按钮：逐层返回，无历史则回首页
backBtn.addEventListener('click', ()=>{
  if(history.length > 1) history.back();
  else location.href = '../index.html';
});

/* ============================================================
   诗详情视图：翻译 / AI评诗 / 笺注
   ============================================================ */
const detailView = document.getElementById('detailView');

// ===== 乐江AI 配置（与 ai.html 同源，后台静默调用）=====
const AI_URL   = 'https://api.agnes-ai.cn/v1/chat/completions';
const AI_KEY   = 'sk-coiOt3YttnpJakJOLvsAhnt82ttTK8qq0TDOQaBwN38MULHj';
const AI_MODEL = 'agnes-2.5-flash';
const AI_SYSTEM_PROMPT = '你是一位精通古典诗词的学者，擅长诗词翻译与鉴赏。回复用中文，条理清晰，语言雅致但通俗易懂。';

let currentDetail = null; // 当前详情诗对象

// 简易 Markdown 渲染（加粗/换行）
function renderMdLite(text){
  let h = esc(text);
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  return h;
}

// 点击诗篇 → 进入详情
listEl.addEventListener('click', e=>{
  const art = e.target.closest('.poem'); if(!art) return;
  const no = parseInt(art.dataset.no,10); if(!no) return;
  const id = getCurrentAuthor().id;
  history.pushState({a:id, p:no}, '', '#a='+id+'&p='+no);
  applyAuthor();
  window.scrollTo({top:0});
});

function hideDetail(){
  document.body.classList.remove('detail-open');
  detailView.innerHTML = '';
  currentDetail = null;
}

function detailCacheKey(task){
  return 'poemai_' + getCurrentAuthor().id + '_' + currentDetail.no + '_' + task;
}
function jianzhuKey(){
  return 'poemnote_' + getCurrentAuthor().id + '_' + currentDetail.no;
}

function showDetail(no){
  const p = POEMS.find(x=>x.no===no);
  if(!p){ hideDetail(); return; }
  currentDetail = p;

  const linesHtml = p.lines.map(l=>'<p>'+esc(l)+'</p>').join('');
  const epi = p.epigraph ? '<div class="poem-epigraph">'+esc(p.epigraph)+'</div>' : '';
  const note = p.note ? '<div class="poem-note"><span class="note-mark">注</span>'+esc(p.note)+'</div>' : '';

  detailView.innerHTML = ''
    + '<button class="detail-back" type="button" id="detailBack">← 返回诗目</button>'
    + '<div class="detail-head">'
    + '<span class="poem-no">' + String(p.no).padStart(2,'0') + '</span>'
    + '<h2 class="detail-title">' + esc(p.title) + '</h2>'
    + '<span class="poem-genre '+genreClass(p.genre)+'">' + esc(p.genre) + '</span>'
    + '<span class="poem-date">' + esc(p.createLabel) + '</span>'
    + '</div>'
    + epi
    + '<div class="detail-body">' + linesHtml + '</div>'
    + note
    + '<div class="detail-actions">'
    + '<button class="action-btn" type="button" id="btnTrans">译 · 翻译</button>'
    + '<button class="action-btn" type="button" id="btnReview">鉴 · AI评诗</button>'
    + '<button class="action-btn" type="button" id="btnNote">笺 · 笺注</button>'
    + '</div>'
    + '<div class="detail-output" id="detailOutput"></div>';

  document.getElementById('detailBack').addEventListener('click', ()=>{
    history.back();
  });
  document.getElementById('btnTrans').addEventListener('click', ()=>doTrans());
  document.getElementById('btnReview').addEventListener('click', ()=>doReview());
  document.getElementById('btnNote').addEventListener('click', toggleJianzhu);

  document.body.classList.add('detail-open');
  window.scrollTo({top:0});
}

// 构建提示词：标题+体式+公元纪年+注释+诗句
function buildPrompt(p, task){
  const year = String(p.create).slice(0,4);
  let s = '请看这首诗：\n';
  s += '标题：' + p.title + '\n';
  s += '体式：' + p.genre + '\n';
  s += '创作时间：' + p.createLabel + '（公元' + year + '年）\n';
  if(p.note) s += '注释：' + p.note + '\n';
  if(p.epigraph) s += '题记：' + p.epigraph + '\n';
  s += '\n' + p.lines.join('\n') + '\n\n';
  s += task === 'trans' ? '请翻译这首诗。' : '请评价这首诗。';
  return s;
}

// 后台调用乐江AI（不弹窗，结果内嵌展示）
async function callPoemAI(prompt){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 45000);
  try{
    const res = await fetch(AI_URL, {
      method: 'POST',
      mode: 'cors',
      credentials: 'omit',
      signal: controller.signal,
      headers: {
        'Authorization': 'Bearer ' + AI_KEY,
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        model: AI_MODEL,
        messages: [
          { role: 'system', content: AI_SYSTEM_PROMPT },
          { role: 'user', content: prompt }
        ],
        temperature: 0.7,
        stream: false
      })
    });
    if(!res.ok) throw new Error('busy');
    const data = await res.json();
    const reply = (data?.choices?.[0]?.message?.content || data?.response || '').trim();
    if(!reply) throw new Error('empty');
    return reply;
  } finally {
    clearTimeout(timer);
  }
}

// 生成/获取一个结果盒子（已存在则复用）
function ensureBox(task, title){
  let box = document.getElementById('box-' + task);
  if(!box){
    box = document.createElement('div');
    box.className = 'ai-box';
    box.id = 'box-' + task;
    box.innerHTML = '<div class="ai-box-title"><b>' + title + '</b><span class="ai-box-tag"></span></div>'
      + '<div class="ai-box-content"></div>';
    document.getElementById('detailOutput').appendChild(box);
  }
  return box;
}

function fillBox(box, content, tag){
  box.querySelector('.ai-box-tag').textContent = tag || '';
  box.querySelector('.ai-box-content').innerHTML = renderMdLite(content);
}

function loadingBox(box, text){
  box.querySelector('.ai-box-tag').textContent = '';
  box.querySelector('.ai-box-content').innerHTML =
    '<div class="ai-loading"><span class="typing-indicator"><span></span><span></span><span></span></span>' + esc(text) + '</div>';
}

function errorBox(box){
  box.querySelector('.ai-box-content').innerHTML =
    '<span class="ai-error">⚠️ 乐江AI繁忙，请稍后重试~</span>';
}

// 翻译：有固定翻译用固定，否则本地缓存，再否则调AI
async function doTrans(){
  const p = currentDetail; if(!p) return;
  const box = ensureBox('trans', '译');
  const btn = document.getElementById('btnTrans');
  btn.classList.add('active');

  if(p.trans){ fillBox(box, p.trans, '定译'); return; }

  const cacheKey = detailCacheKey('trans');
  const cached = localStorage.getItem(cacheKey);
  if(cached){ fillBox(box, cached, '已缓存'); return; }

  loadingBox(box, '乐江AI正在翻译…');
  try{
    const reply = await callPoemAI(buildPrompt(p, 'trans'));
    localStorage.setItem(cacheKey, reply);
    fillBox(box, reply, '乐江AI');
  }catch(e){
    errorBox(box);
    btn.classList.remove('active');
  }
}

// AI评诗：本地缓存优先
async function doReview(){
  const p = currentDetail; if(!p) return;
  const box = ensureBox('review', '鉴');
  const btn = document.getElementById('btnReview');
  btn.classList.add('active');

  const cacheKey = detailCacheKey('review');
  const cached = localStorage.getItem(cacheKey);
  if(cached){ fillBox(box, cached, '已缓存'); return; }

  loadingBox(box, '乐江AI正在赏评…');
  try{
    const reply = await callPoemAI(buildPrompt(p, 'review'));
    localStorage.setItem(cacheKey, reply);
    fillBox(box, reply, '乐江AI');
  }catch(e){
    errorBox(box);
    btn.classList.remove('active');
  }
}

// 笺注：本地读写后感（不上传）
function toggleJianzhu(){
  const p = currentDetail; if(!p) return;
  let box = document.getElementById('box-jianzhu');
  if(box){ box.remove(); document.getElementById('btnNote').classList.remove('active'); return; }

  document.getElementById('btnNote').classList.add('active');
  box = ensureBox('jianzhu', '笺');
  const saved = localStorage.getItem(jianzhuKey()) || '';
  box.querySelector('.ai-box-content').innerHTML =
    '<textarea class="jianzhu-area" id="jianzhuArea" placeholder="写写你的读后感、批注、联想……"></textarea>'
    + '<button class="jianzhu-save" type="button" id="jianzhuSave">存 笺</button>'
    + '<p class="jianzhu-hint">笺注仅保存在你的本机浏览器，不会上传</p>';
  document.getElementById('jianzhuArea').value = saved;
  document.getElementById('jianzhuSave').addEventListener('click', ()=>{
    localStorage.setItem(jianzhuKey(), document.getElementById('jianzhuArea').value.trim());
    document.getElementById('jianzhuSave').textContent = '已存 ✓';
    setTimeout(()=>{ const b = document.getElementById('jianzhuSave'); if(b) b.textContent = '存 笺'; }, 1600);
  });
}

// 初始化
applyAuthor();
</script>
