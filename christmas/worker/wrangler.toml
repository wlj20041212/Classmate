# Cloudflare Worker 配置文件
# 部署步骤：
#   1. npm install -g wrangler        （如未安装）
#   2. wrangler login                （登录 Cloudflare）
#   3. wrangler kv:namespace create PHOTOS   （创建 KV 命名空间）
#      → 把返回的 id 填到下面 kv_namespaces.id
#   4. wrangler deploy               （部署 Worker）
#   5. 把得到的 Worker URL 填到 Christmas.html 里的 window.PHOTO_UPLOAD_URL

name = "christmas-photo"
main = "photo-worker.js"
compatibility_date = "2024-12-01"

# KV 命名空间：存储上传的照片
# ⚠️ 把下面的 id 换成你 `wrangler kv:namespace create PHOTOS` 返回的真实 id
[[kv_namespaces]]
binding = "PHOTOS"
id = "在这里填入你的KV命名空间ID"
