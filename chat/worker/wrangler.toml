# 飞鸽传书 Cloudflare Worker 配置
# 部署步骤：
#   1. npm install -g wrangler          （如未安装）
#   2. wrangler login                   （登录 Cloudflare）
#   3. wrangler kv:namespace create MESSAGES  （创建消息KV）
#   4. wrangler kv:namespace create CODES     （创建兑换码KV）
#   5. 把返回的 id 填到下方 kv_namespaces.id
#   6. wrangler secret put OWNER_PASSWORD    （设置owner密码）
#   7. wrangler secret put OWNER_SECRET_KEY  （设置JWT签名密钥，随便一串字符）
#   8. wrangler secret put WX_APPID          （微信测试号 appID）
#      wrangler secret put WX_SECRET        （微信测试号 appsecret）
#      wrangler secret put WX_TOKEN         （自定义Token，与测试号接口配置一致）
#      wrangler secret put WX_TEMPLATE_ID   （测试号模板消息的模板ID）
#   9. wrangler deploy
#  10. 把 Worker URL 填到 chat/index.html 的 API_BASE
#  11. 微信测试号页面（mp.weixin.qq.com/debug/cgi-bin/sandboxinfo）：
#      - 「接口配置信息」URL 填 https://<worker域名>/wx/callback，Token 与 WX_TOKEN 一致
#      - 「模板消息接口」新增模板，标题「飞鸽传书」，内容（四行，变量前必须带说明文字+冒号，否则正文空白）：
#          {{first.DATA}}
#          信件动态：{{keyword1.DATA}}
#          寄出信息：{{keyword2.DATA}}
#          {{remark.DATA}}
#        得到的模板ID填入 WX_TEMPLATE_ID

name = "pigeon-chat"
main = "worker.js"
compatibility_date = "2024-12-01"

# 每分钟检查到点信件：推送送达/殒命微信通知（仅 get/put 单key，不占 list 额度）
[triggers]
crons = ["* * * * *"]

# 消息存储 KV
[[kv_namespaces]]
binding = "MESSAGES"
id = "f2bd5339a757492b8992b1ced068ff53"

# 兑换码 KV
[[kv_namespaces]]
binding = "CODES"
id = "0e325ac2a8674a57a3a30e415d061e97"
