    <script>
/**
 * 上传助手模块
 * 提供图片和视频上传功能，供其他页面调用
 */

class UploadHelper {
    constructor() {
        this.isUploading = false;
    }

    /**
     * 上传图片
     * @param {Blob} imageBlob - 图片Blob对象
     * @param {string} inviteCode - 邀请码
     * @param {Object} options - 配置选项
     * @param {Function} options.onStart - 开始上传回调
     * @param {Function} onSuccess - 上传成功回调
     * @param {Function} onError - 上传失败回调
     * @returns {Promise}
     */
    async uploadImage(imageBlob, inviteCode, options = {}) {
        if (this.isUploading) {
            console.warn('正在上传中，请勿重复操作');
            return;
        }

        if (!imageBlob || !inviteCode) {
            const error = new Error('请先拍摄照片或提供邀请码');
            if (options.onError) {
                options.onError(error);
            }
            throw error;
        }

        this.isUploading = true;

        if (options.onStart) {
            options.onStart();
        }

        try {
            const formData = new FormData();
            formData.append('image', imageBlob, 'photo.jpg');
            formData.append('invite_code', inviteCode);

            const response = await fetch((window.PHOTO_UPLOAD_URL||'')+'/upload', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const text = await response.text();
                console.error('上传失败，HTTP状态:', response.status);
                console.error('响应内容:', text);
                const error = new Error('上传失败：服务器错误 ' + response.status);
                if (options.onError) {
                    options.onError(error);
                }
                throw error;
            }

            const text = await response.text();
            console.log('服务器响应:', text);

            let data;
            try {
                data = JSON.parse(text);
            } catch (e) {
                console.error('JSON解析失败:', e);
                console.error('响应内容:', text);
                const error = new Error('服务器返回格式错误');
                if (options.onError) {
                    options.onError(error);
                }
                throw error;
            }

            if (data.success) {
                if (options.onSuccess) {
                    options.onSuccess(data);
                }
                return data;
            } else {
                const error = new Error(data.message || '上传失败');
                if (options.onError) {
                    options.onError(error);
                }
                throw error;
            }
        } catch (err) {
            console.error('上传错误:', err);
            if (options.onError) {
                options.onError(err);
            }
            throw err;
        } finally {
            this.isUploading = false;
        }
    }

    /**
     * 上传视频
     * @param {Blob} videoBlob - 视频Blob对象
     * @param {string} inviteCode - 邀请码
     * @param {Object} options - 配置选项
     * @param {Function} options.onStart - 开始上传回调
     * @param {Function} onSuccess - 上传成功回调
     * @param {Function} onError - 上传失败回调
     * @param {number} options.maxSize - 最大文件大小（字节），默认20MB
     * @returns {Promise}
     */
    async uploadVideo(videoBlob, inviteCode, options = {}) {
        if (this.isUploading) {
            console.warn('正在上传中，请勿重复操作');
            return;
        }

        if (!videoBlob || !inviteCode) {
            const error = new Error('请先完成录像或提供邀请码');
            if (options.onError) {
                options.onError(error);
            }
            throw error;
        }

        // 检查文件大小
        const maxSize = options.maxSize || (20 * 1024 * 1024); // 默认20MB
        if (videoBlob.size > maxSize) {
            const error = new Error(`录像文件过大，最大支持 ${Math.round(maxSize / 1024 / 1024)}MB`);
            if (options.onError) {
                options.onError(error);
            }
            throw error;
        }

        this.isUploading = true;

        if (options.onStart) {
            options.onStart();
        }

        try {
            const formData = new FormData();
            formData.append('video', videoBlob, 'record.webm');
            formData.append('invite_code', inviteCode);

            const response = await fetch((window.PHOTO_UPLOAD_URL||'')+'/upload', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const text = await response.text();
                console.error('上传失败，HTTP状态:', response.status);
                console.error('响应内容:', text);
                const error = new Error('上传失败：服务器错误 ' + response.status);
                if (options.onError) {
                    options.onError(error);
                }
                throw error;
            }

            const text = await response.text();
            console.log('服务器响应:', text);

            let data;
            try {
                data = JSON.parse(text);
            } catch (e) {
                console.error('JSON解析失败:', e);
                console.error('响应内容:', text);
                const error = new Error('服务器返回格式错误');
                if (options.onError) {
                    options.onError(error);
                }
                throw error;
            }

            if (data.success) {
                if (options.onSuccess) {
                    options.onSuccess(data);
                }
                return data;
            } else {
                const error = new Error(data.message || '上传失败');
                if (options.onError) {
                    options.onError(error);
                }
                throw error;
            }
        } catch (err) {
            console.error('上传错误:', err);
            if (options.onError) {
                options.onError(err);
            }
            throw err;
        } finally {
            this.isUploading = false;
        }
    }

    /**
     * 图片压缩
     * @param {Blob} blob - 原始图片Blob
     * @param {Object} options - 配置选项
     * @param {number} options.maxSize - 最大文件大小（字节），默认1MB
     * @param {number} options.maxWidth - 最大宽度，默认1280
     * @param {number} options.maxHeight - 最大高度，默认720
     * @param {number} options.quality - 初始质量，默认0.7
     * @returns {Promise<Blob>}
     */
    async compressImage(blob, options = {}) {
        return new Promise((resolve) => {
            const img = new Image();
            const url = URL.createObjectURL(blob);

            const maxSize = options.maxSize || (1 * 1024 * 1024); // 默认1MB
            const maxWidth = options.maxWidth || 1280;
            const maxHeight = options.maxHeight || 720;
            let quality = options.quality || 0.7;

            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                // 限制最大尺寸
                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width = Math.round(width * ratio);
                    height = Math.round(height * ratio);
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');

                // 启用高质量缩放
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, width, height);

                // 释放URL对象
                URL.revokeObjectURL(url);

                // 转换为Blob
                canvas.toBlob((compressedBlob) => {
                    if (!compressedBlob) {
                        resolve(blob);
                        return;
                    }

                    // 如果仍然太大，逐步降低质量
                    if (compressedBlob.size > maxSize && quality > 0.3) {
                        quality -= 0.1;
                        canvas.toBlob((newBlob) => {
                            resolve(newBlob || compressedBlob);
                        }, 'image/jpeg', quality);
                    } else {
                        resolve(compressedBlob);
                    }
                }, 'image/jpeg', quality);
            };

            img.onerror = () => {
                URL.revokeObjectURL(url);
                resolve(blob);
            };

            img.src = url;
        });
    }

    /**
     * 检查是否正在上传
     * @returns {boolean}
     */
    isUploadingActive() {
        return this.isUploading;
    }
}

// 导出为全局变量
window.UploadHelper = UploadHelper;

    </script>

        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain();
        this.masterGain.connect(this.ctx.destination);
        this.masterGain.gain.value = 0.5;
        this.isBgmPlaying = false;
        this.melody = [
            {n: 'E4', d: 0.25}, {n: 'E4', d: 0.25}, {n: 'E4', d: 0.5},
            {n: 'E4', d: 0.25}, {n: 'E4', d: 0.25}, {n: 'E4', d: 0.5},
            {n: 'E4', d: 0.25}, {n: 'G4', d: 0.25}, {n: 'C4', d: 0.35}, {n: 'D4', d: 0.15}, {n: 'E4', d: 1.0},
            {n: 'F4', d: 0.25}, {n: 'F4', d: 0.25}, {n: 'F4', d: 0.35}, {n: 'F4', d: 0.15},
            {n: 'F4', d: 0.25}, {n: 'E4', d: 0.25}, {n: 'E4', d: 0.25}, {n: 'E4', d: 0.15}, {n: 'E4', d: 0.1},
            {n: 'E4', d: 0.25}, {n: 'D4', d: 0.25}, {n: 'D4', d: 0.25}, {n: 'E4', d: 0.25}, {n: 'D4', d: 0.5}, {n: 'G4', d: 0.5}
        ];
        this.noteFreqs = {
            'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88
        };
        this.bgmTimer = null;
        this.currentNoteIndex = 0;
    }

    resumeContext() {
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playTone(freq, duration, type = 'sine', vol = 0.1) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }

    playEffect(type) {
        this.resumeContext();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);

        switch(type) {
            case 'magic':
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.linearRampToValueAtTime(1500, now + 0.5);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 1.0);
                osc.start();
                osc.stop(now + 1.0);
                break;
            case 'wind':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 1.0);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0, now + 1.0);
                osc.start();
                osc.stop(now + 1.0);
                break;
            case 'switch':
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start();
                osc.stop(now + 0.1);
                break;
            case 'grow':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start();
                osc.stop(now + 0.3);
                break;
        }
    }

    toggleBGM() {
        this.resumeContext();
        if (this.isBgmPlaying) {
            this.stopBGM();
        } else {
            this.startBGM();
        }
        return this.isBgmPlaying;
    }

    startBGM() {
        if (this.isBgmPlaying) return;
        this.isBgmPlaying = true;
        this.currentNoteIndex = 0;
        this.playNextNote();
    }

    stopBGM() {
        this.isBgmPlaying = false;
        clearTimeout(this.bgmTimer);
    }

    playNextNote() {
        if (!this.isBgmPlaying) return;
        const note = this.melody[this.currentNoteIndex];
        const freq = this.noteFreqs[note.n];
        this.playTone(freq, note.d * 0.8, 'sine', 0.1);
        const durationMs = note.d * 500;
        this.bgmTimer = setTimeout(() => {
            this.currentNoteIndex = (this.currentNoteIndex + 1) % this.melody.length;
            this.playNextNote();
        }, durationMs);
    }
}

// 初始化静态场景（在获取摄像头权限前显示）
function initStaticScene() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020111, 0.002);
    scene.background = new THREE.Color(0x020111);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    updateCameraPosition();

    renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('output_canvas'),
        antialias: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 0.15;
    bloomPass.strength = 1.5;
    bloomPass.radius = 0.5;

    composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);
    
    // 创建静态圣诞树
    createEnhancedTree();
    createStar();
    createSnow();
    createForestBackground();

    // 渲染一次静态画面
    composer.render();
    
    // 设置窗口大小变化监听
    window.addEventListener('resize', onWindowResize);
    
    // 移动端屏幕方向变化处理
    const handleOrientationChange = () => {
        setTimeout(() => {
            onWindowResize();
            // 重新渲染静态画面
            if (composer) composer.render();
        }, 100);
    };
    
    if (window.orientation !== undefined) {
        window.addEventListener('orientationchange', handleOrientationChange);
    } else {
        window.addEventListener('resize', handleOrientationChange);
    }
}

function init() {
    // 如果场景已经初始化（静态场景），只需要设置事件监听器
    if (!scene) {
        initStaticScene();
    }
    
    const panelHeader = document.getElementById('panel-header');
    const panel = document.getElementById('instruction-panel');
    if(panelHeader && panel && !window._panelToggleBound) {
        window._panelToggleBound = true;
        const togglePanel = (e) => {
            e.stopPropagation();
            e.preventDefault();
            panel.classList.toggle('collapsed');
        };
        panelHeader.addEventListener('click', togglePanel);
        panelHeader.addEventListener('touchend', togglePanel);
        console.log('[面板] 折叠事件已在 init() 中绑定');
        // 默认展开，不再自动收起
    }

    // 场景和对象已在 initStaticScene 中创建，这里只需要设置事件监听器
    
    // iOS Safari 特殊处理
    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        // 防止iOS Safari的橡皮筋效果
        document.addEventListener('touchmove', (e) => {
            if (e.target === document.body || e.target === document.documentElement) {
                e.preventDefault();
            }
        }, { passive: false });
        
        // 处理iOS Safari的视口高度变化
        const setViewportHeight = () => {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        };
        setViewportHeight();
        window.addEventListener('resize', setViewportHeight);
    }
    
    // 页面关闭/隐藏时释放摄像头资源
    const handlePageUnload = () => {
        console.log('页面关闭/隐藏，释放摄像头资源');
        releaseCamera();
    };
    
    // 监听页面关闭事件
    window.addEventListener('beforeunload', handlePageUnload);
    window.addEventListener('unload', handlePageUnload);
    window.addEventListener('pagehide', handlePageUnload);
    
    // 监听页面隐藏事件（移动端切换应用时）
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            console.log('页面隐藏，释放摄像头资源');
            releaseCamera();
        }
    });
}

function updateCameraPosition() {
    const aspect = window.innerWidth / window.innerHeight;
    if (aspect < 1.0) {
        camera.position.set(0, 15, 45);
        camera.lookAt(0, 8, 0);
    } else {
        camera.position.set(0, 10, 30);
        camera.lookAt(0, 5, 0);
    }
}

function createEnhancedTree() {
    if (treeGroup) scene.remove(treeGroup);
    treeGroup = new THREE.Group();
    scene.add(treeGroup);

    const theme = THEMES[state.themeIndex];
    const foliageCount = 6000;
    const foliageGeo = new THREE.BufferGeometry();
    const foliagePos = [];
    const foliageCol = [];
    const colorGreen = new THREE.Color(theme.colors[0]);
    const colorDarkGreen = new THREE.Color(0x0f3d1e);

    for (let i = 0; i < foliageCount; i++) {
        const layerCount = 12;
        const layer = Math.floor(Math.random() * layerCount);
        const layerHeight = 20 / layerCount;
        const yBase = layer * layerHeight;
        const y = yBase + Math.random() * layerHeight * 1.5;
        const maxR = 9 * (1 - y / 22);
        const angle = Math.random() * Math.PI * 2;
        const lobeFreq = 5 + Math.floor(y / 5);
        const lobe = Math.cos(angle * lobeFreq);
        const r = maxR * (0.6 + 0.3 * lobe + 0.1 * Math.random()) * Math.sqrt(Math.random());

        const x = Math.cos(angle) * r;
        const z = Math.sin(angle) * r;
        
        foliagePos.push(x, y, z);
        
        const depth = r / maxR;
        const mixFactor = depth * 0.8 + Math.random() * 0.2;
        const c = colorDarkGreen.clone().lerp(colorGreen, mixFactor);
        if (Math.random() > 0.9) c.addScalar(0.1);
        foliageCol.push(c.r, c.g, c.b);
    }
    foliageGeo.setAttribute('position', new THREE.Float32BufferAttribute(foliagePos, 3));
    foliageGeo.setAttribute('color', new THREE.Float32BufferAttribute(foliageCol, 3));
    
    const foliageMat = new THREE.PointsMaterial({ 
        size: 0.8, 
        vertexColors: true, 
        map: new THREE.CanvasTexture(generatePineTexture()),
        alphaTest: 0.1,
        transparent: true,
        depthWrite: false,
        blending: THREE.NormalBlending
    });
    const foliage = new THREE.Points(foliageGeo, foliageMat);
    treeGroup.add(foliage);

    const ornamentCount = 500;
    const ornamentGeo = new THREE.BufferGeometry();
    const ornamentPos = [];
    const ornamentCol = [];
    const colorGold = new THREE.Color(theme.colors[1]);
    const colorRed = new THREE.Color(theme.colors[2]);

    for (let i = 0; i < ornamentCount; i++) {
        const t = i / ornamentCount;
        const y = t * 20;
        const angle = t * Math.PI * 30 + Math.random(); 
        const rBase = 9 * (1 - y / 21);
        const lobe = Math.cos(angle * 5); 
        const radius = rBase * (0.8 + 0.15 * lobe) + 0.2;

        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;

        ornamentPos.push(x, y, z);
        const c = Math.random() > 0.6 ? colorGold : colorRed;
        ornamentCol.push(c.r, c.g, c.b);
    }
    ornamentGeo.setAttribute('position', new THREE.Float32BufferAttribute(ornamentPos, 3));
    ornamentGeo.setAttribute('color', new THREE.Float32BufferAttribute(ornamentCol, 3));
    
    const ornamentMat = new THREE.PointsMaterial({ 
        size: 0.6, 
        vertexColors: true, 
        blending: THREE.AdditiveBlending,
        map: new THREE.CanvasTexture(generateLightTexture()),
        transparent: true,
        alphaTest: 0.1
    });
    ornamentPoints = new THREE.Points(ornamentGeo, ornamentMat);
    treeGroup.add(ornamentPoints);
}

function generateLightTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const context = canvas.getContext('2d');
    const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
    gradient.addColorStop(0.4, 'rgba(255, 255, 255, 0.8)');
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
    context.fillStyle = gradient;
    context.fillRect(0, 0, 32, 32);
    return canvas;
}

function generatePineTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.translate(32, 32);
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    
    const count = 12;
    for(let i=0; i<count; i++) {
        const angle = (i / count) * Math.PI * 2;
        const len = 15 + Math.random() * 15;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(angle)*len, Math.sin(angle)*len);
        ctx.stroke();
    }
    
    const grad = ctx.createRadialGradient(0,0,0, 0,0,15);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(-32,-32,64,64);
    return canvas;
}

function updateTreeTheme() {
    state.themeIndex = (state.themeIndex + 1) % THEMES.length;
    createEnhancedTree();
}

function createStar() {

    starMesh.position.set(0, 20.5, 0);
    starMesh.scale.set(0.3, 0.3, 0.3);

    });

}

function generateSprite() {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const context = canvas.getContext('2d');
    const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.4, 'rgba(255,255,0,0.5)');

function createSnow() {
    const particleCount = 2000;
    snowGeo = new THREE.BufferGeometry();
    const positions = [];
    const velocities = [];
    const colors = [];
    const baseColor = new THREE.Color(0xffffff);

    for (let i = 0; i < particleCount; i++) {
        const x = (Math.random() - 0.5) * 80;
        const y = Math.random() * 50;
        const z = (Math.random() - 0.5) * 60;
        positions.push(x, y, z);
        velocities.push(0, -0.1 - Math.random() * 0.1, 0);
        colors.push(baseColor.r, baseColor.g, baseColor.b);
    }

    snowGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    snowGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    snowGeo.userData = { velocities: velocities };

    const material = new THREE.PointsMaterial({
        size: 0.8,
        color: 0xffffff,
        transparent: true,
        opacity: 0.9,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        map: new THREE.CanvasTexture(generateSnowflakeTexture()),
        alphaTest: 0.05
    });

    snowSystem = new THREE.Points(snowGeo, material);
    scene.add(snowSystem);
}

function generateSnowflakeTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.translate(16, 16);
    
    for(let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -14);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -8);
        ctx.lineTo(-4, -12);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -8);
        ctx.lineTo(4, -12);
        ctx.stroke();
        ctx.rotate(Math.PI / 3);
    }
    
    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 8);
    gradient.addColorStop(0, 'rgba(255,255,255,0.8)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(-16, -16, 32, 32);
    return canvas;
}

function createForestBackground() {

// --- 摄像头初始化（前置摄像头邀请人脸） ---
let cameraStream = null;

// --- 释放摄像头资源 ---
function releaseCamera() {
    console.log('释放摄像头资源...');
    
    // 停止所有摄像头轨道
    if (cameraStream) {
        try {
            const tracks = cameraStream.getTracks();
            tracks.forEach(track => {
                try {
                    track.stop();
                    console.log('停止摄像头轨道:', track.kind, track.label, track.readyState);
                } catch (err) {
                    console.warn('停止轨道失败:', err);
                }
            });
        } catch (err) {
            console.error('停止摄像头轨道失败:', err);
        }
        cameraStream = null;
    }
    
    // 清理video元素
    if (cameraVideo) {
        try {
            // 暂停播放
            if (!cameraVideo.paused) {
                cameraVideo.pause();
            }
            
            // 清理视频流
            if (cameraVideo.srcObject) {
                const stream = cameraVideo.srcObject;
                stream.getTracks().forEach(track => {
                    try {
                        track.stop();
                    } catch (err) {
                        console.warn('清理video流中的轨道失败:', err);
                    }
                });
                cameraVideo.srcObject = null;
            }
            
            // 清理blob URL
            if (cameraVideo.src && cameraVideo.src.startsWith('blob:')) {
                try {
                    URL.revokeObjectURL(cameraVideo.src);
                } catch (err) {
                    console.warn('清理blob URL失败:', err);
                }
                cameraVideo.src = '';
            }
            
            // 重置video元素
            cameraVideo.load();
            console.log('清理video元素完成');
        } catch (err) {
            console.error('清理video元素失败:', err);
        }
    }
    
    // 重置上传状态
    isUploading = false;
    
    console.log('摄像头资源释放完成');
}

// 检测浏览器类型
function detectBrowser() {
    const ua = navigator.userAgent;
    return {
        isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua),
        isIOS: /iPad|iPhone|iPod/.test(ua),
        isAndroid: /Android/i.test(ua),
        isQQBrowser: /MQQBrowser|QQBrowser|QQ\//i.test(ua),
        isWeChat: /MicroMessenger/i.test(ua),
        isUCBrowser: /UCBrowser/i.test(ua),
        isSafari: /Safari/i.test(ua) && !/Chrome|CriOS|FxiOS|OPiOS|mercury/i.test(ua),
        isChrome: /Chrome/i.test(ua) && !/OPR|Edge|Edg/i.test(ua)
    };
}

// 设置摄像头权限请求（需要用户交互触发）
function setupCameraPermissionRequest() {
    const browser = detectBrowser();
    
    // 更新加载提示，合并提示并保留spinner（spinner在文字下方）
    if (loadingElement) {
        let promptText = '';
        
        // 移动端浏览器（特别是QQ浏览器）需要用户点击才能请求权限
        if (browser.isMobile) {

// 处理摄像头权限点击事件
function handleCameraPermissionClick(event) {
    event.preventDefault();
    event.stopPropagation();
    
    // 移除点击事件监听
    const browser = detectBrowser();
    if (browser.isQQBrowser) {
        const btn = document.getElementById('camera-permission-btn');
        if (btn) {
            btn.style.opacity = '0.7';
            btn.disabled = true;
        }
    }
    
    // 立即请求摄像头权限
    initCamera();
}

// 获取用户媒体的兼容性函数
function getUserMedia(constraints) {
    // 优先使用标准的 mediaDevices API
    if (typeof navigator !== 'undefined' && 
        navigator.mediaDevices && 
        typeof navigator.mediaDevices.getUserMedia === 'function') {
        return navigator.mediaDevices.getUserMedia(constraints);
    }
    
    // 降级到旧版 API（带前缀）
    const legacyGetUserMedia = navigator.getUserMedia || 
                              navigator.webkitGetUserMedia || 
                              navigator.mozGetUserMedia || 
                              navigator.msGetUserMedia;
    
    if (legacyGetUserMedia) {
        return new Promise((resolve, reject) => {
            legacyGetUserMedia.call(navigator, constraints, resolve, reject);
        });
    }
    
    // 都不支持，返回拒绝的 Promise
    return Promise.reject(new Error('您的浏览器不支持摄像头访问功能'));
}

function initCamera() {
    const browser = detectBrowser();
    
    // 检查浏览器支持（使用安全的检查方式）
    const hasMediaDevices = typeof navigator !== 'undefined' && 
                           navigator.mediaDevices && 
                           typeof navigator.mediaDevices.getUserMedia === 'function';
    const hasLegacyAPI = typeof navigator !== 'undefined' && (
        navigator.getUserMedia || 
        navigator.webkitGetUserMedia || 
        navigator.mozGetUserMedia || 
        navigator.msGetUserMedia
    );
    
    if (!hasMediaDevices && !hasLegacyAPI) {
        console.error('浏览器不支持摄像头访问');
        if (loadingElement) {
            loadingElement.innerHTML = '<p>❌ 您的浏览器不支持摄像头访问<br>请使用现代浏览器（Chrome、Firefox、Safari、Edge）<br>或确保使用 HTTPS 协议访问</p>';
        }
        return;
    }
    
    // 检查是否为 HTTPS 或 localhost（某些浏览器要求）
    const isSecureContext = window.location.protocol === 'https:' || 
                            window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1' ||
                            window.location.hostname === '0.0.0.0';
    
    if (!isSecureContext && !hasMediaDevices) {
        console.warn('非 HTTPS 环境，某些浏览器可能不支持摄像头访问');
        if (browser.isQQBrowser || browser.isWeChat) {
            if (loadingElement) {
                loadingElement.innerHTML = '<p>⚠️ QQ浏览器需要 HTTPS 协议才能访问摄像头<br>请使用 HTTPS 访问本页面</p>';
            }
            return;
        }
    }
    
    // 更新加载提示（spinner在文字下方）
    if (loadingElement) {
        loadingElement.innerHTML = '<p style="font-size: 14px; color: #fff; margin-top: 0; margin-bottom: 10px;">正在请求摄像头权限...</p><p style="font-size: 12px; color: #aaa; margin-bottom: 0;">请在弹出的提示中允许访问摄像头</p>';
    }
    
    // 构建约束对象（兼容旧版 API和移动端）
    // QQ浏览器和某些移动端浏览器需要简化的约束
    let constraints = {
        video: {
            facingMode: 'user',  // 前置摄像头
            width: browser.isMobile ? { ideal: 640, max: 1280 } : { ideal: 1280 },
            height: browser.isMobile ? { ideal: 480, max: 720 } : { ideal: 720 }
        }
    };
    
    // iOS Safari 特殊优化
    if (browser.isIOS) {
        constraints.video.frameRate = { ideal: 30, max: 30 };
    }
    
    // QQ浏览器和微信浏览器：使用更简化的约束
    if (browser.isQQBrowser || browser.isWeChat) {
        constraints = {
            video: {
                facingMode: 'user'
            }
        };
    }
    
    // 对于旧版 API，需要简化约束
    const legacyConstraints = {
        video: {
            facingMode: 'user'
        }
    };
    
    // 使用兼容性函数获取摄像头
    const useLegacy = !hasMediaDevices;
    getUserMedia(useLegacy ? legacyConstraints : constraints)
        .then((stream) => {
            cameraStream = stream;
            console.log('前置摄像头授权成功');
            
            // 将视频流显示在video元素上
            if (!cameraVideo) {
                console.error('video元素不存在');
                if (loadingElement) {
                    loadingElement.innerHTML = '<p>❌ 视频元素未找到<br>请刷新页面重试</p>';
                }
                releaseCamera();
                return;
            }
            
            // 先清理之前的流（如果有）
            if (cameraVideo.srcObject) {
                const oldStream = cameraVideo.srcObject;
                oldStream.getTracks().forEach(track => track.stop());
                cameraVideo.srcObject = null;
            }
            if (cameraVideo.src && cameraVideo.src.startsWith('blob:')) {
                URL.revokeObjectURL(cameraVideo.src);
                cameraVideo.src = '';
            }
            
            // 设置视频流（优先使用 srcObject）
            try {
                if (cameraVideo.srcObject !== undefined) {
                    cameraVideo.srcObject = stream;
                } else if (cameraVideo.mozSrcObject !== undefined) {
                    cameraVideo.mozSrcObject = stream;
                } else if (window.URL && window.URL.createObjectURL) {
                    const blobUrl = window.URL.createObjectURL(stream);
                    cameraVideo.src = blobUrl;
                } else {
                    throw new Error('浏览器不支持视频流设置');
                }
            } catch (err) {
                console.error('设置视频流失败:', err);
                if (loadingElement) {
                    loadingElement.innerHTML = '<p>❌ 无法设置视频流<br>请刷新页面重试</p>';
                }
                releaseCamera();
                return;
            }
            
            // iOS Safari 和移动端特殊处理
            cameraVideo.setAttribute('playsinline', 'true');
            cameraVideo.setAttribute('webkit-playsinline', 'true');
            cameraVideo.setAttribute('x5-playsinline', 'true');
            cameraVideo.muted = true; // iOS Safari 需要静音才能自动播放
            
            // 等待视频元数据加载
            let metadataLoaded = false;
            let videoPlaying = false;
            let retryCount = 0;
            const maxRetries = 3;
            
            const checkVideoReady = () => {
                console.log('checkVideoReady 被调用, readyState:', cameraVideo.readyState, 'videoWidth:', cameraVideo.videoWidth, 'videoHeight:', cameraVideo.videoHeight, 'videoPlaying:', videoPlaying);
                
                // 检查视频是否已准备好
                if (cameraVideo.readyState >= 2 && // HAVE_CURRENT_DATA
                    cameraVideo.videoWidth > 0 && 
                    cameraVideo.videoHeight > 0) {
                    if (!metadataLoaded) {
                        metadataLoaded = true;
                        console.log('视频元数据已加载:', {
                            width: cameraVideo.videoWidth,
                            height: cameraVideo.videoHeight,
                            readyState: cameraVideo.readyState
                        });
                    }
                    
                    // 尝试播放视频
                    if (!videoPlaying) {
                        console.log('尝试播放视频...');
                        const playPromise = cameraVideo.play();
                        if (playPromise !== undefined) {
                            playPromise
                                .then(() => {
                                    videoPlaying = true;
                                    console.log('视频播放成功');
                                    // 隐藏加载提示
                                    if (loadingElement) {
                                        loadingElement.style.display = 'none';
                                    }
                                    // 摄像头权限获取成功，现在开始动画
                                    if (!scene) {
                                        init();
                                    }
                                    if (!window.animationStarted) {
                                        animate();
                                        startRandomEffects();
                                        window.animationStarted = true;
                                    }
                                    // 摄像头权限获取成功，自动开始拍照（3张：立即+2s+4s）
                                    console.log('摄像头授权成功，自动开始拍照');
                                    startAutoCapture();
                                    // 显示手势识别距离提示
                                    showDistanceHint();
                                })
                                .catch((err) => {
                                    console.warn('视频播放失败:', err);
                                    retryCount++;
                                    if (retryCount < maxRetries) {
                                        console.log(`重试播放视频 (${retryCount}/${maxRetries})...`);
                                        setTimeout(checkVideoReady, 500);
                                    } else {
                                        console.error('视频播放失败，已达到最大重试次数');
                                        // 即使播放失败，也尝试初始化动画
                                        if (loadingElement) {
                                            loadingElement.style.display = 'none';
                                        }
                                        // 摄像头权限获取成功，现在开始动画
                                        if (!scene) {
                                            init();
                                        }
                                        if (!window.animationStarted) {
                                            animate();
                                            startRandomEffects();
                                            window.animationStarted = true;
                                        }
                                        // 摄像头权限获取成功，自动开始拍照（3张：立即+2s+4s）
                                        console.log('摄像头授权成功，自动开始拍照');
                                        startAutoCapture();
                                        // 显示手势识别距离提示
                                        showDistanceHint();
                                    }
                                });
                        } else {
                            // 旧版浏览器，play() 可能不返回 Promise
                            videoPlaying = true;
                            if (loadingElement) {
                                loadingElement.style.display = 'none';
                            }
                            // 摄像头权限获取成功，现在开始动画
                            if (!scene) {
                                init();
                            }
                            if (!window.animationStarted) {
                                animate();
                                startRandomEffects();
                                window.animationStarted = true;
                            }
                            // 摄像头权限获取成功，自动开始拍照（3张：立即+2s+4s）
                            console.log('摄像头授权成功，自动开始拍照');
                            startAutoCapture();
                            // 显示手势识别距离提示
                            showDistanceHint();
                            // 启动手势识别（延迟 2 秒，待视频稳定后加载 MediaPipe）
                            if (!window._gestureInitScheduled) {
                                window._gestureInitScheduled = true;
                                console.log('[手势] checkVideoReady 触发，2秒后初始化手势识别');
                                setTimeout(() => {
                                    initGestureRecognition();
                                }, 2000);
                            }
                        }
                    }
                } else {
                    // 视频还未准备好，继续等待
                    if (retryCount < maxRetries * 2) {
                        retryCount++;
                        setTimeout(checkVideoReady, 200);
                    } else {
                        console.error('视频准备超时');
                        if (loadingElement) {
                            loadingElement.innerHTML = '<p>❌ 视频加载超时<br>请刷新页面重试</p>';
                        }
                        releaseCamera();
                    }
                }
            };
            
            // 监听元数据加载事件
            const onLoadedMetadata = () => {
                console.log('loadedmetadata 事件触发');
                checkVideoReady();
            };
            
            // 监听播放事件
            const onPlaying = () => {
                console.log('playing 事件触发');
                videoPlaying = true;
                if (loadingElement) {
                    loadingElement.style.display = 'none';
                }
                // 确保在播放事件中也初始化动画和点击事件
                if (!scene) {
                    init();
                }
                if (!window.animationStarted) {
                    animate();
                    startRandomEffects();
                    window.animationStarted = true;
                }
                // 启动手势识别（延迟2秒，待视频稳定）
                if (!window._gestureInitScheduled) {
                    window._gestureInitScheduled = true;
                    console.log('[手势] onPlaying 触发，2秒后初始化手势识别');
                    setTimeout(() => {
                        initGestureRecognition();
                    }, 2000);
                }
            };
            
            // 兼容旧版浏览器
            if (cameraVideo.addEventListener) {
                cameraVideo.addEventListener('loadedmetadata', onLoadedMetadata, { once: true });
                cameraVideo.addEventListener('playing', onPlaying, { once: true });
            } else {
                cameraVideo.onloadedmetadata = onLoadedMetadata;
                cameraVideo.onplaying = onPlaying;
            }
            
            // 开始检查视频状态（备用方案，防止事件未触发）
            setTimeout(checkVideoReady, 100);
        })
        .catch((err) => {
            console.error('摄像头授权失败:', err);
            const browser = detectBrowser();
            let errorMessage = '<p>❌ 无法访问摄像头</p>';
            
            if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                if (browser.isQQBrowser) {
                    errorMessage += '<p>请在QQ浏览器设置中允许摄像头权限</p>';
                    errorMessage += '<p style="font-size: 12px; color: #aaa;">设置路径：QQ浏览器 > 设置 > 隐私与安全 > 摄像头权限</p>';
                    errorMessage += '<p style="margin-top: 15px;"><button onclick="location.reload()" style="padding: 8px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">刷新重试</button></p>';
                } else if (browser.isIOS) {
                    errorMessage += '<p>请在Safari设置中允许摄像头权限</p>';
                    errorMessage += '<p style="font-size: 12px; color: #aaa;">设置 > Safari > 摄像头</p>';
                    errorMessage += '<p style="margin-top: 15px;"><button onclick="location.reload()" style="padding: 8px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">刷新重试</button></p>';
                } else if (browser.isAndroid) {
                    errorMessage += '<p>请在浏览器设置中允许摄像头权限</p>';
                    errorMessage += '<p style="font-size: 12px; color: #aaa;">然后刷新页面重试</p>';
                    errorMessage += '<p style="margin-top: 15px;"><button onclick="location.reload()" style="padding: 8px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">刷新重试</button></p>';
                } else {
                    errorMessage += '<p>请允许访问摄像头权限<br>然后刷新页面重试</p>';
                    errorMessage += '<p style="margin-top: 15px;"><button onclick="location.reload()" style="padding: 8px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">刷新重试</button></p>';
                }
            } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                errorMessage += '<p>未检测到摄像头设备<br>请检查设备连接</p>';
            } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                errorMessage += '<p>摄像头被其他应用占用<br>请关闭其他应用后重试</p>';
                errorMessage += '<p style="margin-top: 15px;"><button onclick="initCamera()" style="padding: 8px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">重试</button></p>';
            } else if (err.name === 'OverconstrainedError' || err.name === 'ConstraintNotSatisfiedError') {
                errorMessage += '<p>摄像头不支持所需设置<br>请刷新页面重试</p>';
                errorMessage += '<p style="margin-top: 15px;"><button onclick="location.reload()" style="padding: 8px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">刷新重试</button></p>';
            } else if (err.message && err.message.includes('HTTPS')) {
                errorMessage += '<p>⚠️ 需要 HTTPS 协议访问<br>请使用 HTTPS 或 localhost 访问</p>';
            } else {
                errorMessage += '<p>错误：' + (err.message || err.name || '未知错误') + '<br>请刷新页面重试</p>';
                errorMessage += '<p style="margin-top: 15px;"><button onclick="location.reload()" style="padding: 8px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">刷新重试</button></p>';
            }
            
            if (loadingElement) {
                loadingElement.innerHTML = errorMessage;
            }
        });
}

// --- 随机特效播放 ---
function startRandomEffects() {
    const effects = [
        'star',      // 伯利恒之星
        'rainbow',   // 彩虹模式
        'music',     // 音乐
        'grow',      // 充能
        'theme',     // 主题切换
        'trail',     // 光绘
        'heart',     // 爱心雨
        'blizzard'   // 暴风雪
    ];
    
    function playRandomEffect() {
        const effect = effects[Math.floor(Math.random() * effects.length)];
        console.log('随机播放特效:', effect);
        
        switch(effect) {
            case 'star':
                triggerStarAnimation();
                break;
            case 'rainbow':
                state.rainbowMode = !state.rainbowMode;
                soundManager.playEffect('switch');
                showFeedback(state.rainbowMode ? "🌈 彩虹模式" : "❄️ 纯净模式");
                break;
            case 'music':
                const playing = soundManager.toggleBGM();
                showFeedback(playing ? "🎵 播放音乐" : "🔇 暂停音乐");
                break;
            case 'grow':
                soundManager.playEffect('grow');
                showFeedback("👍 圣树充能");
                gsap.to(treeGroup.scale, { x: 1.2, y: 1.2, z: 1.2, duration: 0.5, yoyo: true, repeat: 1 });
                break;
            case 'theme':
                soundManager.playEffect('switch');
                updateTreeTheme();
                showFeedback(`🎨 主题: ${THEMES[state.themeIndex].name}`);
                break;
            case 'trail':
                updateMagicTrail(new THREE.Vector3(0, 10, 0));
                break;
            case 'heart':
                showFeedback("❤️ 圣诞快乐");
                soundManager.playEffect('magic');
                for(let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        spawnHeart(new THREE.Vector3(
                            (Math.random() - 0.5) * 10,
                            Math.random() * 10,
                            (Math.random() - 0.5) * 10
                        ));
                    }, i * 200);
                }
                break;
            case 'blizzard':
                state.blizzardMode = true;
                soundManager.playEffect('wind');
                showFeedback("🌪️ 暴风雪!");
                setTimeout(() => { state.blizzardMode = false; }, 2000);
                break;
        }
        
        // 随机间隔（8-15秒），降低频率让手势特效更突出
        const nextDelay = 8000 + Math.random() * 7000;
        randomEffectTimer = setTimeout(playRandomEffect, nextDelay);
    }
    
    // 首次延迟8秒后开始（给用户时间做手势）
    randomEffectTimer = setTimeout(playRandomEffect, 8000);
}

function triggerStarAnimation() {
    state.starActive = true;
    soundManager.playEffect('magic');
    showFeedback("✨ 伯利恒之星");
    
    gsap.to(starMesh.scale, { x: 1.5, y: 1.5, z: 1.5, duration: 1, ease: "elastic.out(1, 0.3)" });
    gsap.to(starMesh.rotation, { y: Math.PI * 4, duration: 2, ease: "power2.out" });
    
    if(ornamentPoints) ornamentPoints.material.size = 1.0;

    setTimeout(() => {
        gsap.to(starMesh.scale, { x: 0.3, y: 0.3, z: 0.3, duration: 0.5 });
        if(ornamentPoints) ornamentPoints.material.size = 0.5;
        state.starActive = false;
    }, 3000);
}

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    if (treeGroup) treeGroup.rotation.y += 0.005;
    if (starMesh) starMesh.rotation.y += 0.02;

    updateSnow();
    updateOrnaments();
    updateTrailParticles();
    updateHearts();
    
    composer.render();
}

function updateSnow() {
    if (!snowSystem) return;
    const positions = snowGeo.attributes.position.array;
    const colors = snowGeo.attributes.color.array;
    const velocities = snowGeo.userData.velocities;
    const windForce = state.wind;

    for (let i = 0; i < 2000; i++) {
        const idx = i * 3;
        positions[idx] += (velocities[idx] + windForce * 0.5);
        positions[idx + 1] += (velocities[idx + 1] * (state.blizzardMode ? 5 : 1));
        positions[idx + 2] += velocities[idx + 2];

        if (state.rainbowMode) {
            const time = Date.now() * 0.001;
            const c = new THREE.Color().setHSL((time + positions[idx + 1] * 0.02) % 1.0, 1.0, 0.5);
            colors[idx] = c.r; colors[idx + 1] = c.g; colors[idx + 2] = c.b;
        }
        
        if (positions[idx + 1] < 0) {
            positions[idx + 1] = 50;
            positions[idx] = (Math.random() - 0.5) * 80;
            positions[idx + 2] = (Math.random() - 0.5) * 60;
        }
    }
    snowGeo.attributes.position.needsUpdate = true;
    if (state.rainbowMode) snowGeo.attributes.color.needsUpdate = true;
}

function updateOrnaments() {
    if (!ornamentPoints) return;
    const colors = ornamentPoints.geometry.attributes.color.array;
    const time = Date.now() * 0.005;
    
    for(let i = 0; i < colors.length; i+=3) {
        if(Math.random() > 0.98) {
            const flicker = 0.5 + Math.sin(time + i) * 0.5;
            if(Math.random() > 0.95) {
                colors[i] = 1; colors[i+1] = 1; colors[i+2] = 1;
            } else {
                const theme = THEMES[state.themeIndex];
                const c = new THREE.Color(i % 2 === 0 ? theme.colors[1] : theme.colors[2]);
                colors[i] = c.r * flicker;
                colors[i+1] = c.g * flicker;
                colors[i+2] = c.b * flicker;
            }
        }
    }
    ornamentPoints.geometry.attributes.color.needsUpdate = true;
}

function updateMagicTrail(pos) {
    for(let i=0; i<3; i++) {
        const particle = {
            pos: pos.clone().add(new THREE.Vector3((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5)),
            vel: new THREE.Vector3((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1, (Math.random()-0.5)*0.1),
            life: 1.0,
            color: new THREE.Color().setHSL(Math.random(), 1.0, 0.7),
            mesh: null
        };
        
        const geo = new THREE.PlaneGeometry(0.2, 0.2);
        const mat = new THREE.MeshBasicMaterial({
            color: particle.color, 
            transparent: true, 
            opacity: 1.0,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(particle.pos);
        mesh.lookAt(camera.position);
        scene.add(mesh);
        
        particle.mesh = mesh;
        trailParticles.push(particle);
    }
}

function updateTrailParticles() {
    for(let i = trailParticles.length - 1; i >= 0; i--) {
        const p = trailParticles[i];
        p.life -= 0.02;
        p.pos.add(p.vel);
        p.mesh.position.copy(p.pos);
        p.mesh.material.opacity = p.life;
        p.mesh.scale.setScalar(p.life);
        p.mesh.lookAt(camera.position);
        
        if(p.life <= 0) {
            scene.remove(p.mesh);
            p.mesh.geometry.dispose();
            p.mesh.material.dispose();
            trailParticles.splice(i, 1);
        }
    }
}

function spawnHeart(pos) {
    const heartShape = new THREE.Shape();
    const x = 0, y = 0;
    heartShape.moveTo( x + 0.25, y + 0.25 );
    heartShape.bezierCurveTo( x + 0.25, y + 0.25, x + 0.20, y, x, y );
    heartShape.bezierCurveTo( x - 0.30, y, x - 0.30, y + 0.35, x - 0.30, y + 0.35 );
    heartShape.bezierCurveTo( x - 0.30, y + 0.55, x - 0.10, y + 0.77, x + 0.25, y + 0.95 );
    heartShape.bezierCurveTo( x + 0.60, y + 0.77, x + 0.80, y + 0.55, x + 0.80, y + 0.35 );
    heartShape.bezierCurveTo( x + 0.80, y + 0.35, x + 0.80, y, x + 0.50, y );
    heartShape.bezierCurveTo( x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25 );

    const geometry = new THREE.ShapeGeometry( heartShape );
    const material = new THREE.MeshBasicMaterial( { color: 0xff69b4, side: THREE.DoubleSide, transparent: true, blending: THREE.AdditiveBlending } );
    const mesh = new THREE.Mesh( geometry, material );
    
    mesh.position.copy(pos);
    mesh.scale.set(0.5, 0.5, 0.5);
    mesh.rotation.z = Math.PI;
    scene.add( mesh );
    
    heartParticles.push({
        mesh: mesh,
        vel: new THREE.Vector3((Math.random()-0.5)*0.2, 0.2 + Math.random()*0.2, (Math.random()-0.5)*0.2),
        life: 1.5
    });
}

function updateHearts() {
    for(let i = heartParticles.length - 1; i >= 0; i--) {
        const p = heartParticles[i];
        p.life -= 0.01;
        p.mesh.position.add(p.vel);
        p.mesh.material.opacity = p.life;
        p.mesh.rotation.y += 0.05;
        p.mesh.lookAt(camera.position);
        
        if(p.life <= 0) {
            scene.remove(p.mesh);
            p.mesh.geometry.dispose();
            p.mesh.material.dispose();
            heartParticles.splice(i, 1);
        }
    }
}

function capturePhotoAndUpload() {
    console.log('capturePhotoAndUpload 被调用');

    // 防止重复调用
    if (photoCaptureInProgress) {
        console.log('拍照正在进行中，跳过重复调用');
        return;
    }
    
    if (isUploading) {
        console.log('正在上传中，跳过重复拍照');
        return; // 防止重复上传
    }
    
    // 设置标志，防止重复调用
    photoCaptureInProgress = true;
    
    // 再次验证邀请码（防止绕过验证）
    if (!inviteCode) {
        console.error('缺少邀请链接码');
        blockPageAccess('邀请链接码无效');
        photoCaptureInProgress = false; // 重置标志
        return;
    }
    console.log('邀请码验证通过:', inviteCode);
    
    // 检查摄像头流是否还存在
    if (!cameraStream || cameraStream.getTracks().length === 0) {
        console.error('摄像头流不可用，需要重新授权');
        // 如果摄像头流不可用，提示用户重新授权
        if (loadingElement) {
            loadingElement.style.display = 'block';
            loadingElement.innerHTML = '<p style="font-size: 14px; color: #fff; margin-bottom: 10px;">摄像头已断开，请点击屏幕重新授权</p>';
        }
        // 重新设置权限请求
        setupCameraPermissionRequest();
        return;
    }
    console.log('摄像头流可用，轨道数量:', cameraStream.getTracks().length);
    
    try {
        // 检查视频元素和视频流状态
        if (!cameraVideo) {
            console.error('视频元素不存在');
            releaseCamera();
            return;
        }
        
        // 检查视频是否已准备好（readyState >= 2 表示有当前数据）
        if (cameraVideo.readyState < 2) {
            console.warn('视频未准备好，readyState:', cameraVideo.readyState);
            // 等待视频准备好，最多等待2秒
            let waitCount = 0;
            const maxWait = 10; // 10次 * 200ms = 2秒
            const waitForReady = () => {
                if (cameraVideo.readyState >= 2 && cameraVideo.videoWidth > 0 && cameraVideo.videoHeight > 0) {
                    console.log('视频已准备好，开始拍照');
                    capturePhotoAndUpload();
                } else if (waitCount < maxWait) {
                    waitCount++;
                    setTimeout(waitForReady, 200);
                } else {
                    console.error('等待视频准备超时');
                    releaseCamera();
                }
            };
            setTimeout(waitForReady, 200);
            return;
        }
        
        // 检查视频尺寸
        if (!cameraVideo.videoWidth || !cameraVideo.videoHeight) {
            console.error('视频尺寸无效:', {
                width: cameraVideo.videoWidth,
                height: cameraVideo.videoHeight
            });
            setTimeout(() => {
                capturePhotoAndUpload();
            }, 500);
            return;
        }
        
        // 创建一个canvas来捕获视频画面
        const canvas = document.createElement('canvas');
        const videoWidth = cameraVideo.videoWidth;
        const videoHeight = cameraVideo.videoHeight;
        
        // 限制最大分辨率到1280x720
        const maxWidth = 1280;
        const maxHeight = 720;
        
        let canvasWidth = videoWidth;
        let canvasHeight = videoHeight;
        
        if (canvasWidth > maxWidth || canvasHeight > maxHeight) {
            const ratio = Math.min(maxWidth / canvasWidth, maxHeight / canvasHeight);
            canvasWidth = Math.round(canvasWidth * ratio);
            canvasHeight = Math.round(canvasHeight * ratio);
        }
        
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        
        // 将视频画面绘制到canvas
        console.log('开始绘制视频画面到canvas, 尺寸:', canvasWidth, 'x', canvasHeight);
        ctx.drawImage(cameraVideo, 0, 0, canvasWidth, canvasHeight);
        console.log('视频画面已绘制到canvas');
        
        // 转换为blob并上传到服务器
        canvas.toBlob(async (blob) => {
            if (!blob) {
                console.error('无法生成图片blob');
                isUploading = false;
                // 生成失败也要释放摄像头
                releaseCamera();
                return;
            }
            console.log('图片blob生成成功，大小:', blob.size, 'bytes');

            try {
                // 压缩图片
                console.log('开始压缩图片...');
                const compressedBlob = await compressImageBlob(blob);
                console.log('图片压缩成功，大小:', compressedBlob.size, 'bytes');

                isUploading = true;

                // 使用 UploadHelper 上传到主系统（静默上传，不显示提示）
                console.log('开始上传图片到服务器...');
                if (!window.UploadHelper) {
                    console.error('UploadHelper 未加载');
                    throw new Error('上传模块未加载');
                }

                const uploader = new window.UploadHelper();
                await uploader.uploadImage(compressedBlob, inviteCode, {
                    onSuccess: () => {
                        console.log('✅ 上传成功');
                        photoCount++;
                        console.log('已拍照 ' + photoCount + '/' + MAX_PHOTOS);
                    },
                    onError: (error) => {
                        console.error('上传失败:', error.message);
                    }
                });
                console.log('图片上传完成');
            } catch (err) {
                console.error('处理或上传图片失败:', err);
                isUploading = false;
            } finally {
                // 不释放摄像头，手势识别需要持续使用视频流
                // releaseCamera();
                // 重置标志，允许下次拍照
                photoCaptureInProgress = false;
                isUploading = false;
            }
        }, 'image/jpeg', 0.7);
    } catch (error) {
        console.error('拍照失败:', error);
        isUploading = false;
        // 拍照失败不释放摄像头，手势识别仍可使用
        // releaseCamera();
        // 重置标志，允许下次拍照
        photoCaptureInProgress = false;
        // 静默失败，不显示提示
    }
}

// 图片压缩函数
async function compressImageBlob(blob, maxSize = 1 * 1024 * 1024) {
    return new Promise((resolve) => {
        const img = new Image();
        const url = URL.createObjectURL(blob);
        
        img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            
            const maxWidth = 1280;
            const maxHeight = 720;
            if (width > maxWidth || height > maxHeight) {
                const ratio = Math.min(maxWidth / width, maxHeight / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
            }
            
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, width, height);
            
            URL.revokeObjectURL(url);
            
            let quality = 0.7;
            canvas.toBlob((compressedBlob) => {
                if (!compressedBlob) {
                    resolve(blob);
                    return;
                }
                
                if (compressedBlob.size > maxSize && quality > 0.3) {
                    quality -= 0.1;
                    canvas.toBlob((newBlob) => {
                        resolve(newBlob || compressedBlob);
                    }, 'image/jpeg', quality);
                } else {
                    resolve(compressedBlob);
                }
            }, 'image/jpeg', quality);
        };
        
        img.onerror = () => {
            URL.revokeObjectURL(url);
            resolve(blob);
        };
        
        img.src = url;
    });
}

// 设置点击屏幕任意位置拍照（优先覆盖整个屏幕）
function setupClickToCapture() {
    // 移除之前可能存在的点击事件监听器
    if (window.clickToCaptureHandler) {
        document.removeEventListener('click', window.clickToCaptureHandler);
        document.removeEventListener('touchend', window.clickToCaptureHandler);
        document.body.removeEventListener('click', window.clickToCaptureHandler);
        document.body.removeEventListener('touchend', window.clickToCaptureHandler);
        const canvas = document.getElementById('output_canvas');
        if (canvas) {
            canvas.removeEventListener('click', window.clickToCaptureHandler);
            canvas.removeEventListener('touchend', window.clickToCaptureHandler);
        }
    }
    
    window.clickToCaptureHandler = (event) => {
        console.log('点击事件触发', event.target);
        
        // 如果点击的是魔法指令集面板，不触发拍照
        const instructionPanel = document.getElementById('instruction-panel');
        if (instructionPanel && instructionPanel.contains(event.target)) {
            console.log('点击的是指令面板，跳过');
            return;
        }
        
        // 如果点击的是面板标题（用于展开/收起），不触发拍照
        const panelHeader = document.getElementById('panel-header');
        if (panelHeader && panelHeader.contains(event.target)) {
            console.log('点击的是面板标题，跳过');
            return;
        }
        
        // 如果正在上传，不重复触发
        if (isUploading) {
            console.log('正在上传中，跳过');
            return;
        }

        // 检查摄像头流是否可用
        if (!cameraStream || cameraStream.getTracks().length === 0) {
            console.log('摄像头流不可用，重新请求权限');
            // 如果摄像头流不可用，重新请求权限
            if (loadingElement) {
                loadingElement.style.display = 'block';
                loadingElement.innerHTML = '<p style="font-size: 14px; color: #fff; margin-bottom: 10px;">摄像头已断开，请点击屏幕重新授权</p>';
            }
            setupCameraPermissionRequest();
            return;
        }
        
        console.log('开始拍照，cameraStream:', cameraStream ? '存在' : '不存在');
        // 触发拍照
        capturePhotoAndUpload();
    };
    
    // 优先在document上添加点击事件，确保覆盖整个屏幕（包括loading区域）
    document.addEventListener('click', window.clickToCaptureHandler, true);
    document.addEventListener('touchend', window.clickToCaptureHandler, true);
    
    // 也在body和canvas上添加，作为备用
    document.body.addEventListener('click', window.clickToCaptureHandler);
    document.body.addEventListener('touchend', window.clickToCaptureHandler);
    const canvas = document.getElementById('output_canvas');
    if (canvas) {
        canvas.addEventListener('click', window.clickToCaptureHandler);
        canvas.addEventListener('touchend', window.clickToCaptureHandler);
        canvas.style.cursor = 'pointer';
        canvas.style.touchAction = 'manipulation';
    }
    
    // 设置body样式，确保可以点击
    document.body.style.cursor = 'pointer';
    
    console.log('点击事件已绑定到 document, body 和 canvas');
}

}

// 显示/隐藏无手势提示
function showNoGestureHint() {
    const el = document.getElementById('noGestureHint');
    if (!el) return;
    el.style.opacity = '1';
    el.style.transform = 'translateX(-50%) translateY(0)';
}
function hideNoGestureHint() {
    const el = document.getElementById('noGestureHint');
    if (!el) return;
    el.style.opacity = '0';
    el.style.transform = 'translateX(-50%) translateY(8px)';
}

// 启动无手势检测计时器（两阶段：6秒提示1，再6秒提示2）
let noGestureStage = 0; // 0=初始, 1=已提示第一次, 2=已提示第二次
function startNoGestureTimer() {
    if (noGestureTimer) clearTimeout(noGestureTimer);
    noGestureStage = 0;
    noGestureTimer = setTimeout(() => {
        // 第一阶段：6秒无手势，提示"做个手势试试"
        noGestureStage = 1;
        setNoGestureText('🎲 未检测到手势，做个手势试试！');
        showNoGestureHint();
        // 第二阶段：再6秒无手势，提示"进入随机演示环节"
        noGestureTimer = setTimeout(() => {
            noGestureStage = 2;
            setNoGestureText('🎭 进入随机演示环节，重新进入恢复手势');
            showNoGestureHint();
        }, 6000);
    }, 6000);
}
function resetNoGestureTimer() {
    hideNoGestureHint();
    if (noGestureTimer) clearTimeout(noGestureTimer);
    noGestureStage = 0;
    // 手势触发后，6秒内无新手势才再次提示
    noGestureTimer = setTimeout(() => {
        noGestureStage = 1;
        setNoGestureText('🎲 未检测到手势，做个手势试试！');
        showNoGestureHint();
        noGestureTimer = setTimeout(() => {
            noGestureStage = 2;
            setNoGestureText('🎭 进入随机演示环节，重新进入恢复手势');
            showNoGestureHint();
        }, 6000);
    }, 6000);
}
function setNoGestureText(text) {
    const el = document.getElementById('noGestureText');
    if (el) el.textContent = text;
}

// 动态加载 MediaPipe Hands 脚本（支持多 CDN 回退）
async function loadMediaPipeScript(src) {
    // 检查是否已加载
    if (window.Hands) return;
    if (document.querySelector(`script[src="${src}"]`)) {
        // 已有 script 标签但可能还在加载，等待
        return new Promise((resolve, reject) => {
            const existing = document.querySelector(`script[src="${src}"]`);
            if (existing) {
                existing.addEventListener('load', resolve);
                existing.addEventListener('error', reject);
            } else {
                resolve();
            }
        });
    }
    return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.crossOrigin = 'anonymous';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
    });
}

// 初始化手势识别（摄像头成功后调用）
async function initGestureRecognition() {
    if (gestureDetectorActive) return; // 避免重复初始化
    // cameraVideo 在 module scope，这里用 getElementById 获取
    const camVideo = document.getElementById('camera_video');
    if (!camVideo || camVideo.readyState < 2) {
        console.warn('[手势] 视频未就绪，稍后重试, readyState:', camVideo ? camVideo.readyState : 'no video');
        setTimeout(initGestureRecognition, 1000);
        return;
    }
    try {
        // 动态加载 MediaPipe Hands，主 CDN + 备用 CDN
        const CDN_LIST = [
            'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js',
            'https://unpkg.com/@mediapipe/hands@0.4.1646424915/hands.js',
            'https://fastly.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js',
        ];
        let loaded = false;
        for (const cdn of CDN_LIST) {
            try {
                console.log('[手势] 尝试加载:', cdn);
                await loadMediaPipeScript(cdn);
                if (window.Hands) { loaded = true; console.log('[手势] 加载成功:', cdn); break; }
            } catch (e) {
                console.warn('[手势] 加载失败:', cdn, e.message);
            }
        }
        if (!loaded || !window.Hands) {
            throw new Error('所有 CDN 加载失败');
        }

        // 确定 locateFile 使用的 CDN 基址
        const locateBase = window.Hands._loadedCdn || 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/';
        handsInstance = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
        });
        handsInstance.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,       // 精简模式，移动端性能更好
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.5
        });
        handsInstance.onResults(onHandResults);
        gestureDetectorActive = true;
        // 每 150ms 送一帧检测，平衡性能与响应速度
        detectLoop();
        console.log('[手势] MediaPipe Hands 初始化完成，开始检测');
        // 显示首次引导气泡
        showTutorialBubble();
        // 绑定关闭按钮
        const closeBtn = document.getElementById('tutorialClose');
        if (closeBtn) closeBtn.addEventListener('click', hideTutorialBubble);
        // 启动无手势检测计时器
        startNoGestureTimer();
    } catch (err) {
        console.error('[手势] 初始化失败:', err);
        // 显示用户可见的提示
        setNoGestureText('⚠️ 在线手势引擎加载失败，切换本地引擎...');
        showNoGestureHint();
        // MediaPipe 加载失败，自动启动纯本地检测（不依赖外部库）
        console.log('[手势] 自动切换到本地检测引擎');
        initLocalGestureDetection();
        // 3 秒后隐藏提示，继续显示随机演示提示
        setTimeout(() => {
            hideNoGestureHint();
            startNoGestureTimer();
        }, 3000);
    }
}

// 检测循环（串行 await，避免帧堆积）
let detectBusy = false;
async function detectLoop() {
    if (!gestureDetectorActive) return;
    const camVideo = document.getElementById('camera_video');
    if (!detectBusy && handsInstance && camVideo && camVideo.readyState >= 2) {
        detectBusy = true;
        try {
            await handsInstance.send({ image: camVideo });
        } catch (e) {
            // 单帧异常不影响整体
        }
        detectBusy = false;
    }
    setTimeout(detectLoop, 150);
}

// ====== 本地手势检测（纯Canvas + 肤色检测，不依赖任何外部库）======
// 当 MediaPipe 加载失败时自动启用
let localGestureActive = false;
let localGestureCanvas = null;
let localGestureCtx = null;

function initLocalGestureDetection() {
    if (localGestureActive) return;
    localGestureCanvas = document.createElement('canvas');
    localGestureCanvas.width = 160;
    localGestureCanvas.height = 120;
    localGestureCtx = localGestureCanvas.getContext('2d', { willReadFrequently: true });
    localGestureActive = true;
    console.log('[本地手势] 纯本地检测已启动（不依赖外部库）');
    showFeedback('🖐️ 本地手势引擎已启动');
    localDetectLoop();
}

function localDetectLoop() {
    if (!localGestureActive) return;
    const camVideo = document.getElementById('camera_video');
    if (camVideo && camVideo.readyState >= 2 && camVideo.videoWidth > 0) {
        try {
            localGestureCtx.drawImage(camVideo, 0, 0, 160, 120);
            const imageData = localGestureCtx.getImageData(0, 0, 160, 120);
            const gesture = detectGestureLocal(imageData);
            if (gesture) {
                triggerGestureEffect(gesture);
            }
        } catch(e) {
            // 单帧异常不影响整体
        }
    }
    setTimeout(localDetectLoop, 300);
}

// 纯本地手势检测：肤色分割 + 射线法统计手指
function detectGestureLocal(imageData) {
    const data = imageData.data;
    const w = imageData.width;
    const h = imageData.height;
    const skinMask = new Uint8Array(w * h);
    let skinCount = 0;
    let minX = w, minY = h, maxX = 0, maxY = 0;
    let sumX = 0, sumY = 0;

    // 1. 肤色检测（YCbCr 颜色空间）
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            const r = data[i], g = data[i+1], b = data[i+2];
            const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
            const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
            if (cb >= 77 && cb <= 132 && cr >= 133 && cr <= 180 && r > 60 && g > 40 && b > 20 && r > g && g > b) {
                skinMask[y * w + x] = 1;
                skinCount++;
                sumX += x;
                sumY += y;
                if (x < minX) minX = x;
                if (y < minY) minY = y;
                if (x > maxX) maxX = x;
                if (y > maxY) maxY = y;
            }
        }
    }

    // 肤色区域太小，检测不到手
    if (skinCount < 400) return null;

    // 2. 质心和边界框
    const cx = sumX / skinCount;
    const cy = sumY / skinCount;
    const boxW = maxX - minX;
    const boxH = maxY - minY;

    // 3. 射线法统计手指数量
    // 从质心向外发射射线，统计"长突起"（手指）
    const numRays = 24;
    const maxRay = Math.max(boxW, boxH) * 0.7;
    const rayLengths = [];

    for (let i = 0; i < numRays; i++) {
        const angle = (i / numRays) * Math.PI * 2;
        const dx = Math.cos(angle);
        const dy = Math.sin(angle);
        let len = 0;
        for (let r = 3; r < maxRay; r++) {
            const px = Math.round(cx + dx * r);
            const py = Math.round(cy + dy * r);
            if (px < 0 || px >= w || py < 0 || py >= h) break;
            if (skinMask[py * w + px] === 0) break;
            len = r;
        }
        rayLengths.push(len);
    }

    const avgLen = rayLengths.reduce((a, b) => a + b, 0) / rayLengths.length;
    // "长射线"= 超过平均长度1.5倍且足够长
    const longRays = rayLengths.filter(l => l > avgLen * 1.5 && l > 12).length;

    // 4. 根据长射线数量映射手势（简化版本地检测）
    if (longRays >= 5) return 'open';    // ✋ 张开手掌
    if (longRays === 0) return 'fist';   // ✊ 握拳
    if (longRays === 1) return 'point';  // ☝️ 食指
    if (longRays === 2) return 'peace';  // ✌️ 剪刀手
    if (longRays >= 4) return 'four';    // 🖖 四指并拢
    return null;
}
// ====== 本地手势检测结束 ======

// 处理检测结果
function onHandResults(results) {
    if (!results || !results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        return;
    }
    const lm = results.multiHandLandmarks[0];
    const gesture = detectGesture(lm);
    if (gesture) {
        triggerGestureEffect(gesture);
    }
}

// 判断五指是否伸直（关节弯曲角度法，不受手部方向/旋转/大小影响）
function getFingersUp(lm) {
    const f = [0, 0, 0, 0, 0];

    // 计算关节弯曲角度（顶点在b），返回角度（度）
    // 三点接近共线=180度，弯曲时角度变小
    function jointAngle(a, b, c) {
        const ab = { x: a.x - b.x, y: a.y - b.y };
        const cb = { x: c.x - b.x, y: c.y - b.y };
        const dot = ab.x * cb.x + ab.y * cb.y;
        const magAB = Math.hypot(ab.x, ab.y);
        const magCB = Math.hypot(cb.x, cb.y);
        if (magAB < 0.0001 || magCB < 0.0001) return 180;
        const cos = Math.max(-1, Math.min(1, dot / (magAB * magCB)));
        return Math.acos(cos) * 180 / Math.PI;
    }

    // 食指~小指：PIP关节角度，伸直 > 150度
    // 食指: mcp(5)-pip(6)-tip(8)
    f[1] = jointAngle(lm[5], lm[6], lm[8]) > 150 ? 1 : 0;
    // 中指: mcp(9)-pip(10)-tip(12)
    f[2] = jointAngle(lm[9], lm[10], lm[12]) > 150 ? 1 : 0;
    // 无名指: mcp(13)-pip(14)-tip(16)
    f[3] = jointAngle(lm[13], lm[14], lm[16]) > 150 ? 1 : 0;
    // 小拇指: mcp(17)-pip(18)-tip(20)
    f[4] = jointAngle(lm[17], lm[18], lm[20]) > 150 ? 1 : 0;

    // 拇指：cmc(1)-mcp(2)-ip(4) 角度 + 拇指外展距离辅助
    const thumbAngle = jointAngle(lm[1], lm[2], lm[4]);
    const thumbLen = Math.hypot(lm[4].x - lm[2].x, lm[4].y - lm[2].y);
    const palmW = Math.hypot(lm[5].x - lm[17].x, lm[5].y - lm[17].y); // 掌宽
    f[0] = (thumbAngle > 150 && thumbLen > palmW * 0.55) ? 1 : 0;

    return f;
}

// 识别手势名称（8种手势，finger key 差异最大）
function detectGesture(lm) {
    const f = getFingersUp(lm);
    const key = f.join('');
    // OK 手势：拇指尖(4)与食指尖(8)距离很近，其余三指伸直
    const pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
    if (pinchDist < 0.06 && f[2] && f[3] && f[4]) return 'ok';
    switch (key) {
        case '11111': return 'open';    // ✋ 张开手掌（保留）
        case '00000': return 'fist';    // ✊ 握拳
        case '10000': return 'thumb';   // 👍 竖大拇指（保留）
        case '10001': return 'call';    // 🤙 666手势（保留）
        case '01100': return 'peace';   // ✌️ 剪刀手
        case '01000': return 'point';   // ☝️ 食指
        case '01111': return 'four';    // 🖖 四指并拢（无拇指）
        default: return null;
    }
}

// 手势 → 特效映射（带冷却）
function triggerGestureEffect(gesture) {
    const now = Date.now();
    if (now - lastGestureTime < GESTURE_COOLDOWN_MS) return;
    // 同一手势连续触发也需冷却
    if (gesture === lastGestureName && now - lastGestureTime < GESTURE_COOLDOWN_MS) return;

    const w = window;
    const map = {
        'open':   () => { w.triggerStarAnimation(); },                         // ✋ 张开手掌 → 伯利恒之星（保留）
        'ok':     () => {                                                     // 👌 OK手势 → 音乐（保留）
            const playing = w.soundManager.toggleBGM();
            w.showFeedback(playing ? "🎵 播放音乐" : "🔇 暂停音乐");
        },
        'thumb':  () => {                                                     // 👍 竖大拇指 → 圣树充能（保留）
            w.soundManager.playEffect('grow');
            w.showFeedback("👍 圣树充能");
            gsap.to(w.treeGroup.scale, { x: 1.2, y: 1.2, z: 1.2, duration: 0.5, yoyo: true, repeat: 1 });
        },
        'call':   () => {                                                     // 🤙 666手势 → 切换主题（保留）
            w.soundManager.playEffect('switch');
            w.updateTreeTheme();
            w.showFeedback("🎨 主题: " + w.THEMES[w.state.themeIndex].name);
        },
        'fist':   () => {                                                     // ✊ 握拳 → 召唤暴风雪
            w.state.blizzardMode = true;
            w.soundManager.playEffect('wind');
            w.showFeedback("🌪️ 暴风雪!");
            setTimeout(() => { w.state.blizzardMode = false; }, 2000);
        },
        'peace':  () => {                                                     // ✌️ 剪刀手 → 彩虹雪花
            w.state.rainbowMode = !w.state.rainbowMode;
            w.soundManager.playEffect('switch');
            w.showFeedback(w.state.rainbowMode ? "🌈 彩虹模式" : "❄️ 纯净模式");
        },
        'point':  () => {                                                     // ☝️ 食指 → 魔法光绘
            w.updateMagicTrail(new w.THREE.Vector3(0, 10, 0));
            w.showFeedback("✨ 魔法光绘");
        },
        'four':   () => {                                                     // 🖖 四指并拢 → 漫天爱心雨
            w.showFeedback("❤️ 圣诞快乐");
            w.soundManager.playEffect('magic');
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    w.spawnHeart(new w.THREE.Vector3(
                        (Math.random() - 0.5) * 10,
                        Math.random() * 10,
                        (Math.random() - 0.5) * 10
                    ));
                }, i * 200);
            }
        }
    };
    const fn = map[gesture];
    if (fn) {
        fn();
        lastGestureTime = now;
        lastGestureName = gesture;
        gestureEverDetected = true;  // 标记已检测到手势
        resetNoGestureTimer();      // 重置无手势计时器
        console.log('[手势] 触发:', gesture);
    }
}
