use_default_settings: true

general:
  instance_name: "Lejiang Search"
  debug: false
  contact_url: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh"
  formats:
    - html
    - json

server:
  secret_key: "lejiang_searxng_2024_secret_key_abc123def456"
  bind_address: "0.0.0.0"
