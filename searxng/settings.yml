use_default_settings: true

general:
  instance_name: "Lejiang Search"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh"
  formats:
    - html
    - json

server:
  secret_key: "lejiang_searxng_2024_secret_key_abc123def456"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  public_instance: false

ui:
  static_use_hash: true
  default_locale: ""

# 禁用几个启动会报错的引擎
engines:
  - name: wikidata
    disabled: true
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true

outgoing:
  request_timeout: 10
  max_request_timeout: 15
  useragent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
