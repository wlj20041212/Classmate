<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乐江 AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(160deg, #08081a 0%, #111130 40%, #16163a 100%);
    height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:0;
    color:#fff;
  }

  .chat-container {
    width:100%; height:100vh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  @media(min-width:680px){
    body{padding:14px;}
    .chat-container{
      width:100%; max-width:840px;
      height:94vh; max-height:940px;
      background:rgba(255,255,255,0.025);
      backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
      border-radius:22px;
      border:1px solid rgba(255,255,255,0.06);
      box-shadow:0 24px 70px rgba(0,0,0,0.5);
    }
  }

  /* 头部 */
  .chat-header{
    padding:13px 20px;
    background:rgba(255,255,255,0.035);
    border-bottom:1px solid rgba(255,255,255,0.05);
    display:flex; align-items:center; gap:12px;
    flex-shrink:0;
  }
  .btn-back{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.07);
    color:rgba(255,255,255,0.7);
    width:34px;height:34px;border-radius:10px;
    cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;flex-shrink:0;
  }
  .btn-back:hover{background:rgba(124,58,237,0.15);color:#c4b5fd;border-color:rgba(124,58,237,0.25);}
  .header-avatar{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,#7c3aed,#4338ca);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;flex-shrink:0;
    box-shadow:0 2px 10px rgba(124,58,237,0.35);
  }
  .header-info h1{font-size:15.5px;font-weight:600;letter-spacing:.3px;}
  .header-actions{margin-left:auto;display:flex;gap:6px;}
  .btn-clear{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.07);
    color:rgba(255,255,255,0.5);
    padding:6px 12px;border-radius:10px;
    cursor:pointer;font-size:12px;
    transition:all .2s;
  }
  .btn-clear:hover{background:rgba(239,68,68,0.1);color:#fca5a5;border-color:rgba(239,68,68,0.18);}

  /* 消息区 */
  .chat-messages{
    flex:1;
    overflow-y:auto;
    overflow-anchor:none;
    padding:18px 18px 8px;
    display:flex;flex-direction:column;gap:12px;
    -webkit-overflow-scrolling:touch;
    scroll-behavior:auto;
  }
  .chat-messages::-webkit-scrollbar{width:4px;}
  .chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}

  .msg{display:flex;gap:10px;align-items:flex-start;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .msg-avatar{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;flex-shrink:0;
  }
  .msg-user .msg-avatar{background:linear-gradient(135deg,#ec4899,#f43f5e);}
  .msg-bot  .msg-avatar{background:linear-gradient(135deg,#7c3aed,#4338ca);}

  .msg-content{
    max-width:78%;
    padding:10px 14px;
    border-radius:14px;
    font-size:13.5px;
    line-height:1.75;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:break-word;
  }
  .msg-user{flex-direction:row-reverse;}
  .msg-user .msg-content{
    background:linear-gradient(135deg,#7c3aed,#4338ca);
    color:#fff;border-top-right-radius:4px;
  }
  .msg-bot .msg-content{
    background:rgba(255,255,255,0.055);
    color:rgba(255,255,255,0.88);
    border:1px solid rgba(255,255,255,0.035);
    border-top-left-radius:4px;
  }

  .msg-bot .msg-content pre{
    background:rgba(0,0,0,0.4);
    padding:10px 14px;border-radius:8px;
    overflow-x:auto;margin:8px 0;
    font-size:12.5px;line-height:1.5;
    font-family:'Fira Code','Consolas',monospace;
  }
  .msg-bot .msg-content code{
    background:rgba(0,0,0,0.4);
    padding:1px 5px;border-radius:4px;
    font-size:12.5px;font-family:'Fira Code','Consolas',monospace;
  }
  .msg-bot .msg-content pre code{padding:0;background:none;}

  /* 打字 */
  .typing-indicator{display:flex;gap:4px;padding:4px 0;}
  .typing-indicator span{
    width:5px;height:5px;border-radius:50%;
    background:rgba(255,255,255,0.3);
    animation:typing 1.2s infinite;
  }
  .typing-indicator span:nth-child(2){animation-delay:.2s;}
  .typing-indicator span:nth-child(3){animation-delay:.4s;}
  @keyframes typing{
    0%,60%,100%{transform:translateY(0);opacity:.3;}
    30%{transform:translateY(-5px);opacity:1;}
  }

  /* 输入区 */
  .chat-input-area{
    padding:10px 14px 14px;
    background:rgba(255,255,255,0.015);
    border-top:1px solid rgba(255,255,255,0.04);
    flex-shrink:0;
  }
  .input-wrapper{
    display:flex;gap:10px;align-items:flex-end;
    background:rgba(255,255,255,0.045);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:16px;
    padding:7px 7px 7px 16px;
    transition:border-color .25s;
  }
  .input-wrapper:focus-within{border-color:rgba(124,58,237,0.35);}

  .chat-input{
    flex:1;background:none;border:none;outline:none;
    color:#fff;font-size:14px;
    resize:none;min-height:22px;max-height:120px;
    line-height:1.5;padding:4px 0;
    font-family:inherit;
  }
  .chat-input::placeholder{color:rgba(255,255,255,0.22);}

  .btn-send{
    width:36px;height:36px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#7c3aed,#4338ca);
    color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    transition:transform .15s,opacity .2s;
    flex-shrink:0;

  .btn-send:hover:not(:disabled){transform:scale(1.06);}
  .btn-send:active:not(:disabled){transform:scale(0.92);}
  .btn-send:disabled{opacity:0.3;cursor:not-allowed;}

  .error-msg{
    background:rgba(239,68,68,0.08)!important;
    border:1px solid rgba(239,68,68,0.15)!important;
    color:#fca5a5!important;
  }
  .search-badge{
    display:inline-block;
    font-size:11px;
    background:rgba(124,58,237,0.15);
    color:rgba(196,181,253,0.9);
    padding:2px 8px;
    border-radius:8px;
    margin-bottom:6px;
  }
  .search-status{
    color:rgba(196,181,253,0.7);
    font-size:13px;
  }
  .btn-search-toggle{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.07);
    color:rgba(255,255,255,0.5);
    padding:6px 11px;border-radius:10px;
    cursor:pointer;font-size:12px;white-space:nowrap;
    transition:all .2s;
  }
  .btn-search-toggle.active{
    background:rgba(124,58,237,0.2);
    border-color:rgba(124,58,237,0.4);
    color:#c4b5fd;
  }
</style>

<body>

<div class="chat-container">
  <div class="chat-header">
    <button class="btn-back" onclick="history.back()" title="返回主页">←</button>
    <div class="header-avatar">🤖</div>
    <div class="header-info">
      <h1>乐江 AI</h1>
    </div>
    <div class="header-actions">
      <button class="btn-search-toggle" id="searchToggle" onclick="toggleSearch()">🔍 联网</button>
      <button class="btn-clear" onclick="clearChat()">🗑 清空</button>
    </div>
  </div>

  <div class="chat-messages" id="messages">
    <div class="msg msg-bot">
      <div class="msg-avatar">🤖</div>
      <div class="msg-content">你好！👋 我是乐江 AI，有什么可以帮你的吗？</div>
    </div>
  </div>

  <div class="chat-input-area">
    <div class="input-wrapper">
      <textarea class="chat-input" id="input" placeholder="输入消息，Enter 发送…（联网搜索用简洁词更准）" rows="1"></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<script>
// ===== 配置 =====
// Base URL 以 /v1 结尾（官方要求），JS 里拼接 /chat/completions
const BASE_URL = 'https://api.agnes-ai.cn/v1';
const API_URL = BASE_URL + '/chat/completions';
const API_KEY = 'sk-coiOt3YttnpJakJOLvsAhnt82ttTK8qq0TDOQaBwN38MULHj';
const MODEL   = 'agnes-2.5-flash';

const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('sendBtn');

let history = [];

// ===== 输入框自适应 =====
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ===== 滚动修复（三重保障）=====

// 保障1：强制同步滚动
function forceScroll() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// 保障2：MutationObserver 监听任何 DOM 变化
const obs = new MutationObserver(() => { forceScroll(); });
obs.observe(messagesEl, { childList: true, subtree: true, characterData: true });

// 保障3：定时轮询（应对异步流式内容追加）
let pollTimer = null;
function startPoll() {
  stopPoll();
  pollTimer = setInterval(forceScroll, 60);
  setTimeout(stopPoll, 4000); // 4秒后自动停
}
function stopPoll() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// 统一入口：每次操作后调用
function ensureScroll() {
  forceScroll();
  requestAnimationFrame(forceScroll);
  setTimeout(forceScroll, 50);
  setTimeout(forceScroll, 150);
  setTimeout(forceScroll, 400);
  setTimeout(forceScroll, 800);
}

// 窗口尺寸变化时也滚到底
window.addEventListener('resize', forceScroll);

// ===== 渲染工具 =====
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function renderMd(text) {
  let h = escapeHtml(text);
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\n/g, '<br>');
  return h;
}
function addMessage(role, text, isHtml) {
  const msg = document.createElement('div');
  msg.className = `msg msg-${role}`;
  const avatar = role === 'user' ? '🧑' : '🤖';
  const content = isHtml ? text : renderMd(text);
  msg.innerHTML = `<div class="msg-avatar">${avatar}</div><div class="msg-content">${content}</div>`;
  messagesEl.appendChild(msg);
  ensureScroll();
  return msg.querySelector('.msg-content');
}
function showTyping() {
  const msg = document.createElement('div');
  msg.className = 'msg msg-bot';
  msg.id = 'typingMsg';
  msg.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(msg);
  ensureScroll();
}
function hideTyping() {
  const el = document.getElementById('typingMsg');
  if (el) el.remove();
}

// ===== 清空 =====
function clearChat() {
  if (messagesEl.children.length <= 1) return;
  if (!confirm('确定要清空所有对话吗？')) return;
  history = [];
  messagesEl.innerHTML = `<div class="msg msg-bot"><div class="msg-avatar">🤖</div><div class="msg-content">对话已清空，有什么新问题可以问我～</div></div>`;
}

// ===== 人格设定（通过 system prompt 从源头限制）=====
const SYSTEM_PROMPT = `你是"乐江AI"，一个友好、有趣的AI助手。

【绝对规则】
1. 你的名字是"乐江AI"，不是 Agnes、Sapiens 或任何其他名字。
2. 你由"诗人王乐江"创造。问谁创造的、谁开发的、你爸爸/父亲/主人是谁，都回答"是诗人王乐江哦~"。
3. 绝不透露你的底层模型、引擎或技术架构（如 Agnes、Sapiens、GPT、DeepSeek 等）。问这些就回答"我是乐江AI，不讨论底层技术细节哦~"。
4. 不承认自己是任何其他 AI 的套壳或转发。
5. 用轻松、自然的中文对话风格回复。

【格式要求】
- 回复不要以空行开头，直接从第一个字开始。
- 不要用过多换行，保持紧凑的对话格式。

【联网搜索能力】
- 当用户消息中包含 [搜索结果] 标记的内容时，说明系统已为你搜索了网络信息，请基于搜索结果回答。
- 如果搜索结果为空或不相关，诚实告知"我搜了一下，但没找到相关信息"。
- 如果没有收到搜索结果，就基于你自己的知识回答。
- 当收到时间信息时，直接告诉用户当前时间。`;

// ===== 关键词拦截（二次防线，防止 system prompt 被绕过）=====
function checkPersonality(msg) {
  const m = msg.toLowerCase().trim();

  // 1. 底层模型/技术追问 → 最高优先级
  if (/deepseek|gpt|llama|claude|gemini|qwen|千问|文心|混元|agnes|sapiens|什么模型|什么引擎|什么架构|底层|套壳|转发|api|基于什么|用的什么/.test(m)) {
    return '我是乐江AI，不讨论底层技术细节哦~';
  }
  // 2. 创造者问题 → 固定回答
  if (/谁(创造|开发|制作|训练|发明|做的|写的|造的|搞的).*(你|这个|乐江|ai)|你的?(爸爸|爸|爹|父亲|妈妈|娘|主人|开发者|创造者|作者|老板|创作者|团队|公司)|(乐江|这个ai).*(谁|谁做|谁弄|谁开发|谁造|谁写)|怎么来的|怎么诞生|背景是什么|什么来历/.test(m)) {
    return '是诗人王乐江哦~';
  }
  // 3. 身份问题 → 统一回答"乐江AI"
  if (/你是谁|你是(什么|哪个|啥).*(ai|模型|机器人|助理|助手|东西|引擎|程序|软件|系统)|你叫什么|你是什么|你的名字/.test(m)) {
    return '我是乐江AI。';
  }
  return null;
}

// ===== 联网搜索功能 =====
// 需要部署 Cloudflare Worker，把 URL 填到这里
// 部署方法见下方注释
const SEARCH_WORKER_URL = 'https://lejiang-search.2252821948.workers.dev';
const SEARCH_LIMIT = 70;
const SEARCH_COOLDOWN_MS = 60 * 60 * 1000;

// 联网开关状态
let searchEnabled = localStorage.getItem('lejiang_search_enabled') === 'true';
function toggleSearch() {
  searchEnabled = !searchEnabled;
  localStorage.setItem('lejiang_search_enabled', searchEnabled);
  updateSearchToggleUI();
}
function updateSearchToggleUI() {
  const btn = document.getElementById('searchToggle');
  if (btn) {
    btn.classList.toggle('active', searchEnabled);
    btn.textContent = searchEnabled ? '🔍 联网开' : '🔍 联网';
  }
}

/*
  ===== Cloudflare Worker 部署指南 =====
  1. 注册 https://dash.cloudflare.com （免费）
  2. 左侧菜单 → Workers & Pages → Create application → Create Worker
  3. 给 Worker 取名如 lejiang-search
  4. 删除默认代码，粘贴以下内容：

  export default {
    async fetch(request) {
      const url = new URL(request.url);
      const query = url.searchParams.get('q');
      if (!query) return new Response('{"results":[]}', { headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' } });
      const bingUrl = 'https://www.bing.com/search?q=' + encodeURIComponent(query) + '&count=8&setlang=zh-CN';
      const res = await fetch(bingUrl, { headers: { 'User-Agent': 'Mozilla/5.0' } });
      const html = await res.text();
      return new Response(html, { headers: { 'Content-Type': 'text/html', 'Access-Control-Allow-Origin': '*' } });
    }
  };

  5. 点击 Save and Deploy
  6. 复制 Worker URL（如 https://lejiang-search.xxx.workers.dev）
  7. 把 URL 填到上面的 SEARCH_WORKER_URL 变量中
*/

// 搜索频率控制
function getSearchLog() {
  try { return JSON.parse(localStorage.getItem('lejiang_search_log') || '[]'); }
  catch(e) { return []; }
}
function canSearch() {
  const now = Date.now();
  const logs = getSearchLog().filter(t => now - t < SEARCH_COOLDOWN_MS);
  return logs.length < SEARCH_LIMIT;
}
function recordSearch() {
  const logs = getSearchLog();
  logs.push(Date.now());
  const recent = logs.filter(t => Date.now() - t < 24 * 60 * 60 * 1000);
  localStorage.setItem('lejiang_search_log', JSON.stringify(recent));
}

// 判断是否需要联网搜索（时间查询已在 sendMessage 中单独处理）
function needsSearch(msg) {
  const m = msg.toLowerCase();
  // 搜索意图
  if (/搜索|搜一下|查一下|查查|帮我查|帮我搜|去网上|去搜|联网|网上.*找/.test(m)) return true;
  // 实时信息
  if (/天气|气温|新闻|今天.*发生|最近.*事件|股票|汇率|油价|比分|热搜/.test(m)) return true;
  // 人物/实体信息
  if (/是谁|是什么人|介绍.*一下|资料|简介|生平|背景资料/.test(m)) return true;
  // "最新"关键词（仅当和事件/新闻搭配时才搜索）
  if (/最新.*(新闻|消息|报道|事件|进展)|最近.*(新闻|消息|报道|事件|进展)/.test(m)) return true;
  return false;
}

// 清洗搜索关键词：去掉口语化指令、疑问词、语气词，提取核心搜索内容
// 通用规则，不需要为每个场景单独定义
function cleanSearchQuery(query) {
  let q = query.trim();

  // 1. 去除搜索指令前缀（搜一下/帮我查/联网搜/介绍一下等）
  q = q.replace(/^((请|麻烦|能不能|可以|帮|给我|替我)?\s*我?\s*)?(搜(索|一搜|一下)?|查(询|一下|查)?|找(一下|找)?|联网搜?|去网上搜?|去搜|搜索一下|介绍(一下)?|了解(一下)?|说说|讲讲)\s*/i, '');

  // 2. 去除疑问短语
  q = q.replace(/有什么/g, '');
  q = q.replace(/有没有/g, '');
  q = q.replace(/是不是/g, '');
  q = q.replace(/什么是|是什么|是谁/g, '');

  // 3. 去除疑问代词
  q = q.replace(/怎么样|怎样|如何|为啥|为什么|怎么|啥|什么/g, '');

  // 4. 去除句末语气词
  q = q.replace(/[吗呢啊呀吧哦呐啦]+$/g, '');

  // 5. 时间词标准化（口语转书面，搜索引擎更友好）
  q = q.replace(/昨天/g, '昨日');
  q = q.replace(/今天/g, '今日');
  q = q.replace(/最近/g, '最新');

  // 6. 去除修饰后缀
  q = q.replace(/(的)?(详细资料|详细信息|资料|信息|简介|详情|情况)+$/g, '');

  // 7. 压缩多余空格
  q = q.replace(/\s+/g, ' ').trim();

  // 8. 清洗后为空就用原文
  if (!q) q = query.trim();
  return q;
}

// 执行搜索
async function webSearch(query) {
  if (!canSearch()) {
    return { results: [], limited: true };
  }
  if (!SEARCH_WORKER_URL) {
    return { results: [], limited: false, noWorker: true };
  }
  // 清洗搜索关键词
  const cleanQuery = cleanSearchQuery(query);
  recordSearch();
  try {
    const res = await fetch(`${SEARCH_WORKER_URL}?q=${encodeURIComponent(cleanQuery)}`, {
      method: 'GET',
      signal: AbortSignal.timeout(15000)
    });
    if (!res.ok) return { results: [], limited: false };
    const html = await res.text();
    // 先尝试解析为 JSON（Worker 可能返回 JSON）
    try {
      const jsonData = JSON.parse(html);
      if (jsonData.results && Array.isArray(jsonData.results)) {
        return { results: jsonData.results.slice(0, 8), limited: false };
      }
    } catch(e) { /* 不是 JSON，继续解析 HTML */ }
    // 用正则解析 HTML（避免 DOMParser 在 Bing HTML 上解析错乱）
    const items = parseBingHtml(html);
    return { results: items, limited: false };
  } catch(e) {
    console.error('[乐江AI] 搜索失败:', e);
    return { results: [], limited: false };
  }
}

// 用正则解析 Bing 搜索结果 HTML
// 说明：Bing 的 <li class="b_algo"> 里夹杂着大量 <link> 标签，
// DOMParser 会把它们当作 void 元素并打乱 DOM 结构，导致 querySelector 失效。
// 直接用正则按块提取更稳定。
function parseBingHtml(html) {
  const items = [];
  // 去标签、去实体的辅助函数
  const stripTags = s => (s || '')
    .replace(/<[^>]*>/g, '')
    .replace(/&nbsp;/g, ' ')
    .replace(/&#0?32;/g, ' ')
    .replace(/&#0?160;/g, ' ')
    .replace(/&#0?183;/g, '·')
    .replace(/&amp;/g, '&')
    .replace(/&quot;/g, '"')
    .replace(/&#0?39;/g, "'")
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/\s+/g, ' ')
    .trim();

  // 匹配 <li class="b_algo" ...> ... </li>
  // Bing 的 li 块本身不会嵌套 li，所以用非贪婪 + 直到下一个 <li class="b_algo 或 </ol> 或 </ul>
  const blockRegex = /<li[^>]*class="[^"]*b_algo[^"]*"[^>]*>([\s\S]*?)(?=<li[^>]*class="[^"]*b_algo|<\/ol>|$)/g;
  let m;
  while ((m = blockRegex.exec(html)) !== null && items.length < 8) {
    const block = m[1];
    // 标题：<h2>...<a href="...">文字</a>...</h2>
    const h2Match = block.match(/<h2[^>]*>([\s\S]*?)<\/h2>/i);
    let title = '';
    let url = '';
    if (h2Match) {
      const aMatch = h2Match[1].match(/<a[^>]*href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/i);
      if (aMatch) {
        url = aMatch[1] || '';
        title = stripTags(aMatch[2]);
      } else {
        title = stripTags(h2Match[1]);
      }
    }
    if (!title) continue;
    // 描述：优先 b_caption 里的 p，再回退到任意 p
    let desc = '';
    const capMatch = block.match(/<div[^>]*class="[^"]*b_caption[^"]*"[^>]*>([\s\S]*?)<\/div>/i);
    if (capMatch) {
      const pMatch = capMatch[1].match(/<p[^>]*>([\s\S]*?)<\/p>/i);
      if (pMatch) desc = stripTags(pMatch[1]);
    }
    if (!desc) {
      const pMatch = block.match(/<p[^>]*>([\s\S]*?)<\/p>/i);
      if (pMatch) desc = stripTags(pMatch[1]);
    }
    if (desc.length > 200) desc = desc.slice(0, 200);
    items.push({ title, url, desc });
  }
  return items;
}

// 把搜索结果格式化为上下文文本
function formatSearchContext(query, searchResult) {
  if (searchResult.limited) {
    return `搜索功能暂时受限（一小时内搜索超过${SEARCH_LIMIT}次），请稍后再试。`;
  }
  if (searchResult.noWorker) {
    return `联网搜索服务暂时不可用。请基于你自己的知识回答，如果不知道就说不知道。`;
  }
  if (!searchResult.results || searchResult.results.length === 0) {
    return `搜索"${query}"未能获取到网页结果。请基于你自己的知识回答。`;
  }
  let text = `以下是关于"${query}"的网络搜索结果：\n\n`;
  searchResult.results.forEach((r, i) => {
    text += `[${i + 1}] ${r.title}\n${r.desc}\n\n`;
  });
  text += `\n请基于以上搜索结果回答用户的问题。如果搜索结果不相关，请说明。`;
  return text;
}

// 获取当前时间字符串
function getCurrentTimeInfo() {
  const now = new Date();
  const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  return `当前时间：${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${days[now.getDay()]} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
}

// ===== 对话记录存储到 localStorage =====
function saveChatLog(question, answer, success) {
  try {
    const logs = JSON.parse(localStorage.getItem('agnes_chat_logs') || '[]');
    logs.push({
      t: new Date().toLocaleString('zh-CN'),
      q: question,
      a: success ? answer : '(请求失败) ' + answer,
      ok: success
    });
    // 最多保留 500 条
    if (logs.length > 500) logs.splice(0, logs.length - 500);
    localStorage.setItem('agnes_chat_logs', JSON.stringify(logs));
  } catch(e) { console.error('[乐江AI] 保存记录失败:', e); }
}

// ===== 发送消息 =====
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;

  // 1. 人格拦截
  const locked = checkPersonality(text);
  if (locked !== null) {
    addMessage('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    ensureScroll();
    setTimeout(() => { addMessage('bot', locked); ensureScroll(); }, 250);
    saveChatLog(text, locked, true);
    return;
  }

  // 2. 正常 API 调用
  addMessage('user', text);
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;
  ensureScroll();

  // 3. 判断是否需要联网搜索
  let searchContext = '';
  let searchType = ''; // 'time' | 'web' | ''

  // 时间查询始终可用（不需要联网，用 JS 获取）
  if (/几点|几点了|现在.*时间|今天.*日期|今天.*几号|今天星期|当前时间/.test(text.toLowerCase())) {
    searchContext = getCurrentTimeInfo();
    searchType = 'time';
  } else if (searchEnabled && needsSearch(text)) {
    // 联网搜索（需要开关打开）
    searchType = 'web';
    const typingEl = document.getElementById('typingMsg');
    if (typingEl) {
      typingEl.querySelector('.msg-content').innerHTML = '🔍 正在搜索网络…';
    }
    const searchResult = await webSearch(text);
    searchContext = formatSearchContext(text, searchResult);
  }
  const shouldSearch = searchType !== '';

  // 构建消息：用户消息 + 搜索上下文
  let userMsg = text;
  if (searchContext) {
    userMsg = `${text}\n\n[搜索结果]\n${searchContext}`;
  }

  history.push({ role: 'user', content: userMsg });
  showTyping();
  startPoll();

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      mode: 'cors',
      credentials: 'omit',
      headers: {
        'Authorization': 'Bearer ' + API_KEY,
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...history],
        temperature: 0.7,
        stream: false
      })
    });

    if (!res.ok) {
      const errBody = await res.text();
      let detail = '';
      try { detail = JSON.parse(errBody); } catch(e) {}
      const code = detail?.code || res.status;
      const msg  = detail?.message || detail?.error?.message || errBody.slice(0, 300);
      throw new Error(`[${code}] ${msg}`);
    }

    const data = await res.json();
    hideTyping();
    stopPoll();

    const reply =
      (data?.choices?.[0]?.message?.content ||
      data?.response ||
      data?.message ||
      JSON.stringify(data, null, 2)).trim();

    history.push({ role: 'assistant', content: reply });
    // 如果用了搜索，在回复前加搜索标记
    if (searchType === 'web') {
      const badge = '<div class="search-badge">🔍 已联网搜索</div>';
      addMessage('bot', badge + renderMd(reply), true);
    } else if (searchType === 'time') {
      const badge = '<div class="search-badge">🕐 已获取实时时间</div>';
      addMessage('bot', badge + renderMd(reply), true);
    } else {
      addMessage('bot', reply);
    }
    ensureScroll();
    saveChatLog(text, reply, true);

  } catch (err) {
    hideTyping();
    stopPoll();
    console.error('[乐江AI] 错误:', err);

    let extra = '';
    if (err.message.includes('Failed to fetch') || err.name === 'TypeError') {
      extra = '\n\n可能原因：\n① 浏览器 CORS 拦截（Agnes 网关未对该来源开放）\n② 网络不通（确认能访问 api.agnes-ai.cn）\n③ Key 无效或过期\n\n建议：打开 F12 控制台查看红色报错，截图发我看。';
    }

    const el = addMessage('bot', `⚠️ 请求失败${extra}\n\n${err.message}`);
    el.classList.add('error-msg');
    saveChatLog(text, err.message, false);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
    ensureScroll();
  }
}

// 初始聚焦 + 首次滚动 + 开关 UI
updateSearchToggleUI();
inputEl.focus();
ensureScroll();
</script>
